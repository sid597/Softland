ttenberg (now at Harvard) remain at this intersection with AttentionViz (Yeh et al., IEEE TVCG 30, 2024), embedding query/key vectors to expose global attention patterns.\n\n**Second, LLMs as visualization authors.** VisEval (IEEE TVCG 2025, arXiv 2407.00981) benchmarks 2,524 queries over 146 databases and finds \"prevalent challenges\" in validity, legality, and readability. Microsoft's Data Formulator 2 (arXiv 2408.16119, 2024) responds with iterative human-AI co-authorship, co-evolving data transformation and chart spec rather than demanding a one-shot prompt. \"Evaluating Graphical Perception with Multimodal LLMs\" (arXiv 2504.04221, 2025) replicated Cleveland-McGill on multimodal models and found heterogeneous competence — better than humans on some elementary tasks, failing value-regression. The VIS 2025 biomedical finding \"it looks sexy but it's wrong\" (arXiv 2507.14494) shows generative models produce aesthetically convincing but factually wrong scientific imagery. Most ambitiously, Keith-Norambuena's \"Toward a Machine Bertin\" (arXiv 2602.01527, 2026) argues the entire Bertin→Cleveland-McGill tradition was built for human retinal architecture and that machine consumers need a parallel foundational framework — a conceptual gap, not just a tooling gap.\n\n**Third, infrastructure and politics.** On infrastructure, Heer and Moritz's Mosaic (IEEE TVCG / VIS 2024) uses a coordinator pattern over DuckDB(-WASM) to cross-filter declarative queries, achieving \"one or more orders of magnitude\" speedups and handling 18M points interactively in-browser — at the cost of some grammar-of-graphics expressiveness. On politics, Dhawka and Dasgupta's \"The Social Construction of Visualizations\" (CHI 2025, arXiv 2502.09048) interviewed seventeen practitioners visualizing race/gender demographics and documented irreducible tensions: binary census gender creates \"conceptual missing data,\" some designers reject neutrality outright (\"what society often determines as neutrality is actually just the White cis male version of events\"), and they apply Haraway's \"situated knowledges\" — the picture has politics before any viewer arrives. Jessica Hullman's uncertainty program (Northwestern, 2023–2025) benchmarks visualizations against normative Bayesian inference, offering hypothetical outcome plots and quantile dotplots against the persistently-misread error bar. And a meta-loss looms over all of it: **Distill**, which published the t-SNE article and foundational interpretability work, went on hiatus in July 2021 and has not resumed — volunteer burnout killed the one venue that proved interactive, parameter-explorable scientific publication works. The bet was validated by readers and refuted by sustainability; the infrastructure for that mode of publication still does not exist.", "steal": "Shneiderman's mantra — \"Overview first, zoom and filter, then details-on-demand\" (IEEE VL, 1996) — is the validated ancestor of continuous semantic zoom; pair it with Card-Mackinlay-Shneiderman's reference-model discipline of separating *data tables → visual structures → human views* (1999) so that the \"how did we get here\" braid keeps provenance recoverable at every zoom level rather than collapsing the trail into a polished artifact (the Snow-map failure, where the insight produced the map and the field inherited the map instead of the reasoning).", "avoid": "Do not let a compelling spatial projection assert relationships the underlying truth does not contain — the documented t-SNE/UMAP failure where \"distances between well-separated clusters... may mean nothing\" (Wattenberg/Viégas/Johnson, Distill 2016) yet 40%+ of papers misuse it anyway (Jeon et al., arXiv 2506.08725, 2025) because the output \"looks right\" precisely when it misleads. For an event-log-is-truth system, any zoom/layout that implies causal or semantic proximity must be reconciled against the actual causal DAG, or it is an optimistic-state bug rendered as terrain. Relatedly, do not over-invest in 3D spatial navigation the input device cannot address — Cone Trees (Robertson/Card/Mackinlay, CHI 1991) failed ergonomically, not perceptually.", "open": "The field still cannot measure its own success — van Wijk and Fekete (2008) noted value lies in insight that \"we cannot directly observe or measure\" — and it has never reconciled the insight-versus-communication tension (Kosara/Mackinlay, 2013): open exploration demands minimal framing while telling a specific causal story (\"how did we get here\") demands intentional framing. Softland's braid of commits + discourse-graph + tickets is squarely a *narrative* artifact, so it inherits this unresolved conflict directly — how do you frame a causal story strongly enough to be legible without framing it so strongly that you foreclose the rediscovery the user explicitly values?"}, {"num": 9, "title": "9. Applied Category Theory for Knowledge", "family": "rep", "scent": "Applied category theory: functorial migration = 'one ontology, many projections,' rigorous but tool-starved for 12 years. Its lesson: pick a benchmark.", "body": "### The story: from logical systems to legible diagrams\n\nThe idea that category theory could be a *language for knowledge* — not just a foundation for pure mathematics — has a longer prehistory than the usual Spivak-centered origin story admits. It begins in theoretical computer science with Joseph Goguen and Rod Burstall's theory of **institutions**, sketched in 1984 and given definitive form in their 1992 *Journal of the ACM* paper \"Institutions: Abstract model theory for specification and programming.\" An institution is a category-theoretic abstraction of *a logical system in general*: signatures, sentences, models, and a satisfaction relation required to behave naturally under change of notation. The ambition was already the one that recurs throughout this thread — making formal knowledge transferable across notational systems. Robert E. Kent carried this lineage forward into ontology engineering with his **Information Flow Framework (IFF)** from 2000 onward, a category metatheory for the Standard Upper Ontology, formalized in KIF (Kent, arXiv:1109.0333, 2011). When Kent later co-authored the ologs paper, he brought this institution-theoretic descent with him; Spivak brought accessibility and database semantics.\n\nThe technical engine arrived first, and it is the harder, more falsifiable result. Spivak's **\"Functorial Data Migration\"** was submitted to arXiv on September 6, 2010 (arXiv:1009.1166) and published in *Information and Computation* vol. 217, pp. 31–51, in August 2012 (both dates confirmed). Its claim is precise: a database schema *is* a small category, a database instance *is* a Set-valued functor on it, and a morphism between schemas induces three canonical migration functors — Δ (pullback), and its adjoints Σ and Π (left/right Kan extensions) — that translate instances between schemas, collectively parameterizing projection, union, and join over all tables at once. Decades of ad-hoc SQL ETL became a single algebraic object with universal properties. This was the conceptual seed; everything commercial downstream grows from it.\n\nThe *legible* face of the program is **ologs**. Spivak and Kent submitted \"Ologs: A Categorical Framework for Knowledge Representation\" to arXiv on February 9, 2011 (arXiv:1102.1889) and published it in *PLOS ONE* on January 31, 2012 (doi:10.1371/journal.pone.0024274) — pointedly an open-access *science* journal, not a math journal (all dates and venue confirmed). An olog is a finitely-presented category whose objects and arrows wear English labels: **types** are boxes with singular noun phrases (\"a woman\"), **aspects** are arrows denoting *functional* relations (\"has as her mother\"), and **facts** are commutative diagrams asserting path-equivalence. The decisive technical restriction is that arrows must be functions, which is exactly what makes an olog double as a database schema and makes composition meaningful. The authors confront OWL/RDF head-on: \"one cannot specify commutativity in an RDF schema\" — and commutative diagrams, the categorical statement that two paths agree, are precisely what description logic cannot express and what categories supply for free. The paper is unusually honest: writing a good olog \"demands a clarity of thought that ordinary writing or conversation can more easily elide,\" and an olog encodes a *fragment* of one author's worldview, structurally sound but making no claim to \"correctly reflect reality.\" Translation between worldviews was to happen via **functors** — the categorical answer to the `owl:sameAs` interoperability swamp.\n\nSpivak then built the on-ramp. *Category Theory for the Sciences* (MIT Press, 2014, from a Spring 2013 MIT OCW course) taught CT \"by examples and exercises rather than theorems and proofs,\" with a telling pivot inside it: from ologs (static representation) toward **operads** (compositional dynamics) — a move from *what things are* to *how systems compose over time*. The field then crystallized as a self-aware community around two 2018 events: Fong and Spivak's **\"Seven Sketches in Compositionality\"** (arXiv:1803.05316, March 2018; later Cambridge University Press), which paired seven application domains with seven categorical structures to argue ACT is a *toolkit*, not one idea; and the **ACT 2018** meeting at the Lorentz Center, Leiden — note the precise shape: a school April 23–27 and a workshop April 30–May 4, organized by Coecke, Fong, Kissinger, Lewis, and Tan. (It is often called the field's founding moment, but it was a school-plus-workshop with earlier ACT gatherings preceding it, not a singular \"founding conference.\") John Baez's companion online course drew over 300 enrolled students, an unusual depth of public engagement for graduate mathematics.\n\n### The debates\n\nThe community's internal arguments are sharper and more honest than its external reputation suggests, and they are the most useful part of this history for a builder.\n\nThe framing document for ACT 2018 quoted a 2015 Dagstuhl finding directly: \"people see category theorists only as reconstructing the things they knew already... we do not give them a good reason to care.\" The organizers' response was a *rhetorical reframe* — reconstruction *is* the asset, because it enables transfer across jargon barriers — rather than a refutation. That tension, **reconstruction vs. discovery**, never resolved. The community's own canonical counterexample is Erik Meijer's categorical insight that NoSQL stores are \"co-SQL\" databases (dual to relational ones), the rare case everyone agrees was genuinely *generative* rather than post-hoc — and it remains conspicuously isolated. John D. Cook and others note that many claimed ACT applications are \"post hoc glosses\": existing results redescribed categorically without the categorical structure doing new conceptual work.\n\nThere is also an internal **split of bets** that nobody fully reconciled. Ologs targeted human-authored knowledge for scientists; functorial data migration / CQL targeted the machine layer of formal ETL with compile-time correctness. Different audiences, different success criteria, different failure modes — and no joint theory of adoption. Spivak's own trajectory reads as a symptom: ologs (2011) → functorial data migration / CQL → temporal type theory (sheaves for behavior, 2018) → **polynomial functors** as a general theory of interaction (with Nelson Niu, *Polynomial Functors*, Cambridge, arXiv:2312.00990), which has dominated his work since ~2021. The original flagship application — ologs as a practical KR tool — was largely left behind for deeper theory. Most recently the field has argued about **co-optation**: Baez's September 2025 Azimuth essay engages an argument that ACT risks becoming a tool of military and tech power, and in doing so concedes the field has not yet \"demonstrated the immense practical power of categorical thinking\" — a sympathetic insider admitting the evidence is still inconclusive.\n\n### Roads not taken, and what failed and why\n\nThis is the load-bearing part, and the honest verdict is that ACT-for-knowledge has produced real tools at research scale and almost nothing at production scale — and the reasons are documented, specific, and recurrent.\n\n**Description logic won the standards war, decisively.** OWL 2 became a W3C recommendation in 2009 and remains the production standard (Wikidata, biomedical ontologies, enterprise KGs), backed by mature reasoners (Pellet, HermiT, FaCT++) and tooling (Protégé). Ologs offered expressiveness OWL lacks (commutativity, functorial translation) but lost on a decade's head start, tooling, and decision procedures. Worse, there is **no pipeline from OWL to ologs/CQL**: a 2019 semantic-web@w3.org thread observed that while CT can be *implemented* in OWL, the SROIQ description-logic semantics and the functorial approach are not naturally compatible. The concrete evidence of this dead end is Wisnesky, Spivak, Schultz, and Subrahmanian (2015, arXiv:1502.05947), who tried to replicate a NIST manufacturing integration scenario and explicitly deferred \"understanding the relationship between OWL and FQL and formalizing what the 'black-box OWL reasoner' is doing\" to future work — a formalization that, as far as the published record shows, was never completed. The OWL-to-CT bridge has stayed open for over a decade.\n\n**Ologs shipped without a tool for roughly twelve years.** The 2012 paper had no dedicated authoring or reasoning environment until the Topos Institute's **CatColab** pre-alpha (v0.1 \"Hummingbird,\" October 2, 2024) — confirmed dates on both ends. (The strict claim that *no* olog tool existed before 2024 is hard to verify exhaustively against academic prototypes, so treat the twelve-year figure as the gap between the paper and the first broadly usable tool, not a literal absence of all software.) Expressiveness was also a documented weakness: Evan Patterson's \"Knowledge Representation in Bicategories of Relations\" (arXiv:1706.00526, June 2017) introduced *relational* ologs precisely because plain ologs cannot express non-functional, many-to-many, or partial relations — the substance of real scientific knowledge — explicitly positioning the work as \"interpolating between ologs and description logic.\" That is an admission that ologs as published lived in a gap: neither as expressive as OWL nor as adoptable as a spreadsheet.\n\n**CQL is technically serious and commercially narrow.** It implements functorial data migration with an embedded theorem prover guaranteeing schema-constraint preservation at compile time — but its own documentation states \"CQL is not a database management system: it neither stores nor updates data,\" and its equational theory is undecidable in general (the prover handles decidable fragments and can time out). Cook's June 2019 assessment praised the authors' *restraint* — \"modest prose relative to the revolutionary rhetoric of some category enthusiasts\" — which is itself a backhanded indictment of the surrounding field. Conexus AI (Spivak, Wisnesky, Daimler; production-readiness claimed only for \"single-node in-memory\" workloads, no named enterprise customers on public pages — confirmed) has thin proof points; the Daimler–Wisnesky polemic \"Informal Data Transformation Considered Harmful\" (arXiv:2001.00338, 2020) drew negligible citations while the data world standardized on dbt, Spark, and Airbyte, none of which make any CT claims.\n\n**Joshua Tan's \"The Failures of Category Theory\" (joshuatan.com, May 4, 2018)** is the field's most honest self-accounting and enumerates **eight** specific deficiencies — including the absence of benchmarks to compare CT against traditional methods, no empirical scalability examples, the requirement that data be translated into algebraic models before tools can touch it, the scarcity of implementations producing numerical predictions, and the lack of a calculus for scientific uncertainty. (Two caveats the fact-check forces: the often-repeated \"CT models *recover* rather than *predict*\" line is a fair gloss on the workshop's discussion but is not literally one of the eight numbered items, and the data-interface failure is better stated as Tan's \"we can't interact with data very directly\" than as a clean \"datasets without restructuring\" claim. The essay is Tan's personal report, not an official consensus document.) Tim Porter's December 2018 reply — that multi-scale hierarchical modeling had been addressed in his 1989 *Shape Theory* — cuts both ways: the math existed and was ignored for thirty years, making this an *institutional* failure as much as a mathematical one.\n\nThe deployment graveyard is concrete. **Statebox** (Amsterdam; CT + Petri nets + dependent types + blockchain, promoted by Baez in January 2018) went quiet — its npm package is classified \"Inactive,\" GitHub activity trails off around 2020–2022, with no announced pivot or dissolution. **Open games** (Jules Hedges) gave the field its own self-description: his April 2020 UC Riverside talk was titled \"Open Games: the **Long Road** to Practical Applications,\" flagging tool support as the unresolved problem; a 2023 paper (arXiv:2309.15981) conceded the existing notion \"is not expressive enough\" for stochastic environments or incomplete information. **StockFlow / ModelCollab** epidemiology modeling is the cleanest case of *correct theory, unused practice*: Tom Leinster called it \"serious stuff,\" Nathaniel Osgood helped lead Canada's COVID modeling — and yet, per Quanta (March 2026), it \"remains largely unused among epidemiologists,\" with Osgood hoping for adoption through generational turnover of his students. **Pijul**, the categorical version-control system grounding patch theory in pushouts (following Mimram and di Giusto) to fix Darcs's exponential merge blowup, is the clearest case where CT shaped a *deployed* tool — and even it, per a November 2023 review, has \"not managed to get on enough folks' radar\" against Git hegemony, with no Git interop. Matteo Capucci's line to Quanta is the field's mood in one sentence: \"When I say we're underdogs and nobody likes us, it's not completely true, but it's a bit true.\"\n\n### Cross-disciplinary borrowings and links to other threads\n\nACT is the structural-language layer under several other threads in this report. Its borrowings run *outward* (databases, physics via string diagrams, linguistics, epidemiology, version control) precisely because the central claim is domain-agnostic transfer via functors. The most load-bearing link for Softland is to the **version-control / merge thread**: Pijul's pushout-based patch theory is the same mathematical move — modeling state changes as morphisms whose merges are universal constructions — that any \"braid commits + discourse + tickets into one causal narrative\" system implicitly needs. The **functorial-data-migration** result is the direct analogue of Softland's \"one ontology, many projections\" principle: a discourse relation, a spatial split, a temporal event, and a filesystem node as Δ/Σ/Π images of one schema under different functors. The **knowledge-graph / ontology thread** (OWL, RDF, semantic networks) is ACT's standing rival and cautionary tale: the categorical critique of `owl:sameAs` is exactly the interoperability problem any cross-source braid faces. Finally, **categorical probability** (Markov categories — Fritz, arXiv:1908.07021, 2019; Cho–Jacobs) links ACT to the uncertainty/calibration thread — and its immaturity is *why* CT cannot yet express \"fact vs. hypothesis vs. guess\" natively, a gap Softland would inherit if it took categories literally.\n\n### The 2024–2026 frontier\n\nThe field has moved from aspiration to specialized infrastructure, with three concrete tracks plus a large funding signal.\n\n**CatColab** (Topos Institute, October 2024, v0.1 \"Hummingbird\"; v0.5 \"Sandpiper\" by March 2026) is the first broadly accessible olog/modeling tool, built on Patterson and Lambert's *double-categorical* semantics — \"Representing knowledge and querying data using double-functorial semantics\" (2024) — where a domain logic is a double theory and a model is a lax double functor into Set/spans. It ships ologs, database schemas, regulatory networks, causal-loop and stock-and-flow diagrams, with real-time collaborative URLs. Critically, the Topos 2025–2028 strategic plan commits to a *falsifiable* metric: 100 users using a Topos tool weekly as an essential part of their workflow by mid-2026 — the public benchmark the early work conspicuously lacked.\n\n**AlgebraicJulia** (James Fairbanks, UF; Evan Patterson, Topos) is the most substantive working software: Catlab.jl (v0.17 made the category of ACSets an explicit argument), **GATlab.jl** (arXiv:2404.04837, MFPS 2024; 90+ reusable algebraic theories), and **Decapodes.jl** (*Journal of Computational Science*, 2024) for compositional PDE/multiphysics simulation, DARPA-funded under the **ASKEM** program. The 2025 Patterson–Li–Mabry–Osgood result on compositional system dynamics is ACT at its most convincing: it *proves the formalism practitioners already used since Forrester in the 1960s was categorical all along*, rather than imposing a new one.\n\nThe largest signal is **ARIA's Safeguarded AI programme — £59 million** for mathematical foundations of verifiably safe AI, with David Dalrymple (\"davidad\") explicit that category theory is central (Dalrymple moved to Technical Advisor in February 2026; Nora Ammann became Programme Director; Yoshua Bengio is Scientific Director). It funds a dense cohort — Fabio Zanasi (UCL, string diagrams for probabilistic processes), Sam Staton's Oxford group (categorical probability for world modeling), David Jaz Myers / Sophie Libkind / Owen Lynch (Topos UK, **Double Categorical Systems Theory**), and the GLAIVE lab at Glasgow — documented in Baez's February 2025 \"Category Theorists in AI.\" On the commercial-AI side, **Symbolica** ($33M Series A, April 2024) bet on categorical structure; the position paper \"Categorical Deep Learning is an Algebraic Theory of All Architectures\" (Gavranović et al., arXiv:2402.15332, ICML 2024) frames architectures via monads in 2-categories of parametric maps — but note the fact-check: it is a *position paper* with authors spanning Edinburgh, Cambridge, and DeepMind (Veličković), **not** cleanly a Symbolica–DeepMind co-authorship, and it presents no benchmarks showing categorically-designed architectures beat empirically-designed ones. Symbolica subsequently saw category theorists (Verity, Ghani, Gavranović) depart amid direction conflicts — a reminder that grafting categorical formalism onto an engineering-driven AI company carries organizational risk. Tai-Danae Bradley (SandboxAQ) represents the most mathematically rigorous AI insertion — enriched category theory of language, magnitude of text categories as Tsallis entropies (arXiv:2501.06662, 2025) — but answers a specific structural question, not a deployment.", "steal": "the *functorial-data-migration* shape (Spivak, arXiv:1009.1166, 2010/2012): treat schema/ontology mappings as morphisms and view-changes as the Δ/Σ/Π migration functors. This is the rigorous version of Softland's \"one ontology, many projections\" — discourse relation, spatial split, temporal event, and filesystem node as functor-images of one event-log schema — and it is the one piece of ACT with a clean, deployed analogue (Pijul's pushout merges). Use it as a *design discipline*, not necessarily a runtime: it forces you to define what \"the same fact, projected\" actually means.", "avoid": "the twelve-year *tool gap* and the *no-benchmark* failure. Ologs shipped a beautiful framework with no authoring tool until CatColab in October 2024, and Joshua Tan's \"The Failures of Category Theory\" (May 4, 2018) names the absence of benchmarks comparing CT systems to OWL/RDF as a top deficiency that left the superiority claim unverified for a decade. Do not let Softland's \"papers-as-logs / braided causal narrative\" be a framework without a usable tool and without a head-to-head test against the plain-prose-plus-git baseline it claims to beat.", "open": "categorical machinery is crisp and functional; knowledge is uncertain and many-to-many. Plain ologs cannot express non-functional relations (hence Patterson's relational extension, 2017) and CT still lacks a mature uncertainty calculus (Markov categories — Fritz 2019 — remain unadopted in any deployed knowledge system). For a system whose explicit goal is \"the map must not lie\" — fact vs. hypothesis vs. guess, preserved disagreement before synthesis — *how do you keep categorical structure for the parts that are functional and provenanced while natively representing partial, probabilistic, and contested relations without falling back to ad-hoc tags?* No one in this thread has answered it."}, {"num": 10, "title": "10. Cartographic Generalization & True Semantic Zoom", "family": "space", "scent": "Cartographic generalization is the formal model for honest semantic zoom — simplify without lying. Google Earth proved one-continuous-zoom is achievable.", "body": "The deepest precedent for Softland's central promise — one continuous world from knowledge-landscape down to source code, with no mode-switch — is not a software discipline at all. It is cartography, which spent the twentieth century discovering that you cannot show a world at every scale without lying about it, and the early twenty-first discovering how to lie continuously enough that the lie disappears. The lesson Softland must absorb is that \"semantic zoom\" is not a rendering trick. It is an epistemological commitment about what survives compression, and cartographers have a fifty-year record of failing to automate exactly the part Softland needs most.\n\n**The constitutive distortion.** The framing text is Mark Monmonier's *How to Lie with Maps* (University of Chicago Press, 1991), whose thesis is that distortion is not a defect of mapping but its enabling condition: \"a good map tells a multitude of little white lies; it suppresses truth to help the user see what needs to be seen.\" Monmonier locates three irreducible sources of distortion — scale, projection, and symbolization — and the projection one is a literal theorem: the Gaussian curvature of a sphere cannot be mapped isometrically to a plane, so every flat map sacrifices area, shape, or distance. There is no neutral representation; there is only a deliberate choice of what to falsify. This long predates Monmonier's synthesis. Eduard Imhof, studying city plans at different scales in 1937, was the first to enumerate generalization as a *family* of distinct operations — symbolization, merging, simplification, enhancement, displacement — rather than a single act of shrinking, establishing that reducing scale forces a sequence of judgments about which geographic truth to keep.\n\n**The first quantitative law.** The earliest attempt to mathematize the \"how much survives\" question is the Radical Law of Friedemann Töpfer and Wilhelm Pillewizer, \"The Principles of Selection,\" *The Cartographic Journal* Vol. 3, No. 1, pp. 10–16 (1966), giving N_d = N_s · √(M_s / M_d). The non-obvious content is the square root: halving the scale does not halve surviving features, it retains roughly 71% of them. The law is honest about what it cannot do — it answers *how many* objects survive, never *which ones* or *transformed into what* — and that gap is the entire unsolved problem restated as a formula. (Note on dates: the research's \"Radical Law\" phrasing matches the formula and venue, though Töpfer-Pillewizer's own title was \"The Principles of Selection.\")\n\n**The autocorrelation substrate.** Why is scale-dependent representation meaningful at all rather than arbitrary sampling? Waldo Tobler's answer is the First Law of Geography, stated on page 236 of \"A Computer Movie Simulating Urban Growth in the Detroit Region,\" *Economic Geography* Vol. 46, pp. 234–240 (1970): \"everything is related to everything else, but near things are more related than distant things\" (fact-check: supported, including the page and volume). The story behind it is instructive for Softland's own tendency to elevate throwaway insights into laws — Tobler invoked it almost casually to justify why his population model could use local data, later admitting he \"was probably not extremely serious\" in calling it a law, and a reviewer noted R.A. Fisher had said something similar about spatial plots in 1935. Nevertheless it became the theoretical justification for level-of-detail systems: nearby things share context, so you can co-resolve a neighborhood and the transition artifacts stay small. Tobler's less-cited Second Law — context external to a frame governs what happens inside it — is arguably more important for Softland, because it says you cannot decide what to simplify *within* a local world without knowing the world *around* it.\n\n**The algorithmic heart, and its parallel discovery.** The narrow problem — reduce a digitized line to fewer points while preserving its shape — was solved independently in adjacent fields within a two-year window, which is itself evidence the problem is natural rather than parochial. Urs Ramer published \"An iterative procedure for the polygonal approximation of plane curves\" in *Computer Graphics and Image Processing* Vol. 1, No. 3 (1972) from image processing; David Douglas and Thomas Peucker published the identical recursive algorithm from cartography in 1973. **A correction the source material gets wrong:** that 1973 paper appeared in *The Canadian Cartographer* Vol. 10, No. 2, pp. 112–122 — **not** *Cartographica*; the journal was not renamed Cartographica until 1980, so the widely-repeated \"Cartographica (1973)\" citation is anachronistic (fact-check verdict: refuted). The algorithm draws a chord between endpoints, finds the point of maximum perpendicular distance, keeps it if it exceeds a tolerance ε and recurses, discards everything otherwise. ε directly encodes the scale-dependent \"truth budget.\" Its documented failures matter for any system claiming honest zoom: it is globally blind (local decisions ignore the feature's gestalt), produces spiky artifacts where character-defining points lie close to the chord, and — most dangerously — can emit self-intersecting geometry when ε is large relative to feature scale, severe enough that Wu and Marquez (2003) built a non-self-intersection variant specifically to repair it.\n\nThe principled critique came from Maheswari Visvalingam and J.D. Whyatt at Hull, first in \"The Douglas-Peucker Algorithm for Line Simplification: Re-evaluation through Visualization\" (*Computer Graphics Forum* Vol. 9, No. 4, 1990) and then in their own algorithm in *The Cartographic Journal* Vol. 30, pp. 46–51 (1992/1993). Their attack was epistemological, not merely technical: they argued the field had been \"measuring the wrong things,\" optimizing positional deviation when positional accuracy is not cartographic fidelity. Their algorithm scores each point by *effective area* — the triangle it forms with its two neighbors — and eliminates smallest-area points first, yielding a progressive simplification that degrades gracefully and matches human perception of importance better. The cost is concrete: Martin Fleischmann's 2020 benchmark clocks it roughly 30× slower than Douglas-Peucker (~2.17 ms vs ~74 µs per operation). Mike Bostock's 2012 D3/TopoJSON implementation, storing effective area as a z-coordinate for runtime simplification, spread it across web mapping. **But the road not taken here is the one Softland most needs:** neither algorithm has any notion of *semantic* importance. A river bend that is a named bay, or a coastal indentation that marks a jurisdiction, is treated exactly like geometric noise. This is not an implementation gap but a framing failure — purely geometric simplification structurally cannot preserve semantic structure, which is the precise thing Softland's \"lawful compression\" claim requires.\n\n**The automation graveyard — the most important part.** The field then spent three decades trying to inject knowledge into the process, and the failure record is the single most useful thing in this thread for Softland. The pessimistic baseline was set early: E. Spiess at the 5th International Cartographic Conference (Stresa, 1971) demonstrated tools and concluded fully automated generalization was impossible. The 1980s answer was expert systems encoding cartographers' tacit judgment as rules; Kurt Brassel and Robert Weibel's \"A review and conceptual framework of automated map generalization\" (*International Journal of Geographical Information Systems* Vol. 2, No. 3, pp. 229–244, 1988) decomposed the process into structure recognition, process recognition, process modeling, and process control, and McMaster and Shea's *Generalization in Digital Cartography* (AAG, 1992) formalized eleven operators (select, simplify, smooth, merge, aggregate, typify, collapse, reclassify, exaggerate, displace, enhance). The expert-system program \"foundered somewhat in the late 1990s, coinciding with a general loss of faith in the promise of AI\" (Wikipedia, citing McMaster and Shea). The diagnosis is Andrew Frank's \"Why Is Cartographic Generalization So Hard?\" — the problem is genuinely *AI-hard* because it requires *contextual interpretation*: the right generalization differs between urban and rural areas, but classifying which applies needs world-knowledge that cannot be made fully explicit. Automation succeeds, Frank argues, \"only when decisions rely on directly observable facts without interpretation,\" and generalization fails that test. This is the **knowledge acquisition bottleneck**: experts know how to generalize but cannot articulate rules that survive edge cases without context-sensitive exceptions that then interact unpredictably. The 1990s multi-agent pivot (the European AGENT system, Weibel, Müller and colleagues) distributed the task across negotiating agents but could not resolve operator conflicts — simplify a road vs. maintain its separation from a building has no universal answer — because sequencing remains context-dependent. The 2010s–2020s deep-learning wave hit two new walls: raster models (U-Net, GANs on rendered images) \"cannot maintain well the topology of roads\" and break right-angle building corners; vector models (graph convolutional networks) cannot genuinely model the spatial relationships among multiple polygons, having been built for attribute classification, not geometric transformation (Yan/Fu et al., 2024).\n\n**The strategic retreat.** Because automated generalization failed, the industry retreated to the Multiple Representation Database — maintain a separate dataset per target scale with explicit links between corresponding features. This is failure managed, not solved: every update to the 1:25,000 data must propagate manually to 1:50,000 and 1:100,000, so \"inter-database consistency is lost\" without continuous human curation. National agencies (Ordnance Survey, IGN France, BKG Germany) have run MRDB infrastructure since the early 2000s. The pointed observation for Softland: the \"seamless zoom\" Google Earth users feel is *not* produced by any generalization algorithm — it is a massive pre-computed tile pyramid, a brute-force MRDB at global scale. May Yuan's blunt 2023 assessment (*Cartography and Geographic Information Science* Vol. 51(5), pp. 687–701) is that most GIS remains \"data layers at fixed discrete scales\" without links recording when objects represent the same real entity — and she contrasts this with hippocampal place/grid/boundary cells that achieve dynamic multi-scalar representation through overlapping redundant encoding, a capability absent from every production GIS.\n\n**The Google Earth lineage — and what it actually achieved.** The continuous-zoom-without-mode-switch experience is real but its provenance is misremembered. The foundational technique is the *clipmap* — a partial mipmap storing only the resolution region near the viewpoint — from Christopher Tanner, Christopher Migdal, and Michael Jones, \"The Clipmap: A Virtual Mipmap,\" SIGGRAPH 1998, which virtualized a 170 GB texture at 60 Hz on SGI InfiniteReality hardware costing ~$250,000 (fact-check: SIGGRAPH 1998, 170 GB, InfiniteReality all confirmed). The enabling democratization was Tanner's later \"Universal Texture,\" a consumer-PC port of clipmapping. The company was Keyhole — and here the research overstates founder roles: Google acquired Keyhole in October 2004 and launched Google Earth June 2005 (both confirmed), but the primary founder/CEO was John Hanke, with Michael Jones as CTO and Brian McClendon as investor/co-founder; the firm spun out of Intrinsic Graphics around 2000 but was formally funded circa 2001 (fact-check: founder attributions to Jones/McClendon are mixed, year is disputed — present these with hedging, not as settled fact). Avi Bar-Zeev's account (\"Was Google Earth Stolen? (no),\" Medium, 2021) gives the contribution chain: SGI clipmap → Tanner's Universal Texture → Bar-Zeev's image compression and streaming → David Kornmann's continuous-level-of-detail terrain → Keyhole's network protocol, indexed through a 26+-level quad-tree using Morton codes. Frank Losasso and Hugues Hoppe's \"Geometry Clipmaps\" (SIGGRAPH 2004, *ACM TOG* 23(3)) gave the formal academic articulation of the terrain side. The cultural genealogy is explicit: Hanke credited Neal Stephenson's *Snow Crash* (1992) \"Earth\" application, and the Eames' *Powers of Ten* (1977) supplied the visual grammar of logarithmic scale-zoom — the same grammar Softland's MEMORY.md invokes for zoom 0.001 to 100.\n\n**The patent dispute, corrected.** ART+COM's TerraVision (developed from 1993, German patent filed December 1995) was a genuine precursor, and ART+COM sued Google in 2014 for over $100 million. The suit collapsed at trial (May 2016, Delaware) and on appeal (Federal Circuit, October 2017) on prior art from SRI's separately-named TerraVision. **A correction the research overstates:** the source claims SRI demonstrated \"to over 100 people at two technical conferences in 1994,\" but only one demonstration was in 1994 (the MAGIC Technical Symposium, August 1994, University of Kansas); the second major showing was at SIGGRAPH '95 in August 1995 — where ART+COM members were present and received source code — *before* but not in the same year (fact-check: the \"both in 1994\" framing is refuted; the systems were also not \"identically named,\" merely sharing \"TerraVision\"). Netflix's *The Billion Dollar Code* (2021) dramatized ART+COM's side; Bar-Zeev criticized it for compositing real Keyhole figures into a fictional character. The substantive lesson is convergent invention, not theft — and that ART+COM's system needed supercomputers while Keyhole's contribution was precisely the consumer-hardware port.\n\n**The crucial limit Google Earth did not transcend.** What Keyhole achieved was continuous *geometric* zoom with LOD streaming. What it did *not* achieve — and what no shipping product has — is continuous *semantic* zoom. Labels, features, and layers still appear and disappear at fixed zoom thresholds via discrete rules; the Mapbox Style Specification's zoom-dependent expressions and OpenStreetMap's July-2025 vector-tile rollout (roughly eleven years behind the Mapbox Vector Tile spec, whose default Shortbread style drew community complaints about lost shop names and reduced detail) are elaborations of the discrete approach, not solutions. The geometry transitions smoothly; the *representation mode* still jumps. This is the exact gap Softland sits in: its claim of \"lawful compression\" where identity, provenance, and relations survive across all scales is precisely the continuous-*semantic*-zoom that cartography has never automated.\n\n**The ZUI roads not taken.** The information-visualization lineage offers a parallel cautionary arc. Ken Perlin and David Fox's \"Pad\" (SIGGRAPH 1993) introduced the zoomable infinite plane; Ben Bederson and colleagues' Pad++ engineered it further; Ben Shneiderman's \"The Eyes Have It\" (1996) gave the mantra \"overview first, zoom and filter, then details-on-demand\" — aspirational, since it never specifies *how* semantic content should change across levels. The commercial verdict is Prezi: 50 million users by 2014, the first mainstream ZUI, and a documented failure mode that is directly load-bearing for Softland. Prezi \"forces a spatial relationship where none exists\" — zoom implies geographic containment (continent → country → city), but Prezi presentations use zoom to mean \"next slide,\" a narrative sequence with no spatial meaning, so viewers expecting spatial containment get a thematic jump and become disoriented (plus documented motion sickness from excessive rotation). GNOME Shell similarly abandoned ZUI workspace management (2008–2010) for scrolling. **The unifying failure across generalization algorithms, expert systems, neural nets, Prezi, and GNOME is identical:** what is semantically important at what scale cannot be specified domain-independently in advance. Douglas-Peucker fails because distance is not importance; Prezi fails because zoom is not hierarchy. This is the precise risk for Softland's \"zoom from knowledge-landscape to code\" — if zoom level does not *automatically* imply a real semantic containment in the codebase/discourse-graph, users will be sea-sick and confused, not oriented.\n\n**Cross-disciplinary links.** This thread connects directly to several others in the report. The \"generalization by model vs. generalization by representation\" distinction (Müller, Weibel, Lagrange, Buttenfield, *GIS and Generalization*, 1995) — reduce the conceptual model first, then derive the view, versus simplify the artifact directly — is the cartographic statement of Softland's \"event log is truth, rendered state is projection\": only model-generalization survives, and it is the one that resists automation. The hippocampal multi-resolution parallel (Yuan 2023; Bandrowski et al. 2024) links to any neuroscience/spatial-memory thread. The category-theory thread is implicated by what generalization needs but algorithms lack — a structure-preserving map between representations at different scales is, in spirit, a functor, and the absence of one is exactly why MRDB links must be hand-maintained. And the \"preserved disagreement\" thread surfaces sharply in the posthuman-cartography critique below: standard generalization *converges to a single representation*, which is ideologically loaded; a system preserving plural valid representations per scale needs a different database architecture than raster or vector tiles offer.\n\n**The 2024–2026 frontier.** The most sustained current program is Guillaume Touya's LostInZoom (IGN France, ERC Consolidator Grant #101003012, 2021–2026), which targets the semantic-zoom problem through cognitive science: it names the *desert fog effect* — disorientation when a zoom view is \"totally devoid of navigational cues\" — and proposes *pan-scalar anchors*, landmarks that persist meaningfully across zoom levels for continuous self-localization (Touya et al., *ISPRS IJGI* 12(2):62, 2023, that journal's most-downloaded article that year, finding even spatially-skilled users get disoriented). The program shipped the CartAGen library, MapDraw, and a comprehension game (Mapinou), plus a 2025 \"green cartography\" angle on whether generalization can cut tile-transfer carbon. On the learning side: Fu, Zhou, Xin, and Weibel's explainable-AI study (*IJGIS* 38(10), June 2024) used Integrated Gradients on a ResU-Net for building generalization and found the network prioritizes boundaries over interiors (significant in 95/100 samples) but *cannot* be shown to have learned area-preservation principles — the bottleneck has shifted from rule-formalization to \"we cannot tell what the network learned.\" Courtial, Touya, and Zhang's DeepMapScaler (*CaGIS*, 2024) decomposes generalization into specialized sub-networks because \"map generalization is too complex to be learned with a unique model\" — a pragmatic retreat from end-to-end learning. Sun, Xu et al.'s SCGM (arXiv:2502.04991, Feb 2025) uses cascaded diffusion conditioned on prior smaller-scale outputs but explicitly degrades on natural landscapes and below 1:35,000 where features become symbolic. Pyo, Jiao, Chiang et al.'s FRIEDA benchmark (arXiv:2512.08016, Dec 2024) shows current vision-language models \"struggle significantly with complex cartographic reasoning,\" especially maintaining accuracy across consecutive inference steps. Zhou et al.'s \"GeoAI for map generalization\" research agenda (*IJGIS*, Feb 2026) names four open challenges including cartographic knowledge transfer and LLMs for generalization. Lin and Zhao's \"Posthuman Cartography?\" (*Annals of the AAG* 115(3):499–512, 2025) and Kang and Wang's generative-AI catalog (arXiv:2508.09028, 2025) document hallucination (nonexistent rivers/place-names), bias amplification (overrepresenting frequent patterns, marginalizing rare features and developing regions), and the reproducibility tension between non-determinism and scientific validation. And in a direct cross-domain transfer, Hansen, Bamberg, Baumann, and Hasselbring's \"Semantic Zoom and Mini-Maps for Software Cities\" (arXiv:2510.00003, Oct 2025) applies cartographic semantic zoom to *software visualization* — variable building heights for instance counts, package collapsing, adaptive labels — and found 15/16 participants preferred it but with *no statistically significant* task-time improvement, the mirror of cartography's perceived-usefulness-exceeds-measurable-gain pattern. This is the closest existing analogue to Softland's \"code at zoom 100,\" and its honest null result is a warning.", "steal": "The clipmap/quad-tree streaming architecture (Tanner et al. 1998; Losasso–Hoppe 2004) — stream only the resolution near the viewpoint, always keep a coarser fallback, index everything as positions in one continuously-addressed pyramid so there is never a \"globe mode\" and \"street mode,\" only one space — and pair it with LostInZoom's *pan-scalar anchors* (Touya, ERC #101003012; Touya et al. *ISPRS IJGI* 2023) so identity-bearing landmarks (a commit, a claim, a ticket) persist visibly across zoom levels and prevent the desert-fog disorientation. This operationalizes Softland's \"semantic zoom is lawful compression — identity, provenance, and relations must survive across scale.\"", "avoid": "Do not ship *geometric* zoom dressed as *semantic* zoom — the Prezi failure, where zoom implied a spatial/semantic hierarchy that did not actually exist, producing disorientation and motion sickness rather than orientation (BrightCarbon; ZUI literature), and the parallel cartographic reality that Google Earth's \"seamless\" feel is a brute-force pre-computed tile pyramid, *not* algorithmic semantic generalization (Yuan 2023). If Softland's zoom from knowledge-landscape to code is not backed by a real model-level containment (model-generalization, not representation-generalization — Müller/Weibel/Lagrange/Buttenfield 1995), it will be Prezi at planetary scale.", "open": "No one has automated *model* generalization — deciding what is semantically important at each scale in a domain-independent, principled way — in fifty years; it is the knowledge-acquisition bottleneck Spiess flagged in 1971 and Zhou et al. still flag in 2026, and deep learning has at best moved it from rule-formalization to uninterpretable training-data curation (Fu et al. 2024). Softland's bet that an event-log substrate plus category-theoretic structure-preserving maps can derive honest cross-scale projections is a *direct attempt at the exact problem cartography never solved* — and the unresolved hard question is whether braiding commits + discourse-graph + tickets supplies enough explicit relational structure to make the semantic-importance judgment *computable from the data* rather than requiring a human cartographer's tacit hand at every scale.\n---"}], "supplementary": [{"id": "kittur", "name": "Aniket Kittur (CMU HCII) — the empirical science of scaling sensemaking", "short": "Kittur — sensemaking at scale", "body": "Kittur's lab has spent ~15 years building and *measuring* the exact loop Softland bets on: helping people build understanding on top of others' understanding. Two foundational results matter most. **\"Distributed Sensemaking\"** (CHI 2012) and **\"Standing on the Schemas of Giants: Socially Augmented Information Foraging\"** (CSCW 2014) found that when a person inherits a prior user's sensemaking *structure* (a \"knowledge map\"), **the organization transfers more value than the content itself — especially when the new user has different goals**, and the feared failure modes (people ignore others' structure and start over, or over-trust it without examining the evidence) did *not* materialize. His framing of the problem: \"we spend 1 trillion hours a year making sense of the web\"; the long-term goal is a \"Knowledge Accelerator\" (CHI 2016) letting distributed people synthesize what others learned. The recent AI-era bench is deep: **Synergi** (UIST 2023, graph-mining + LLMs over interconnected literature threads), **Selenite** (CHI 2024, LLM web-sensemaking with explicit hallucination mitigation), plus Threddy, Crystalline, Wigglite, Strata, Tabs.do, Mesh, Fuse (2020–2022); newest work (BioSpark, InkSpire, CHI 2025) pushes \"composite cognition\" where humans + LLMs + agents work in partnership.", "steal": "the measured finding that *structure > content for reuse, especially across differing goals* is direct empirical support for \"preserve the trail/schema, not just the result\" — Softland's papers-as-logs bet is not untested.", "avoid": "his synthesis UIs document how fast these interfaces grow in complexity/effort — the cost of imposing structure (cf. the end-user-programming \"abstraction cliff\", thread 5).", "open": "does the reuse result hold when the \"prior user\" whose schema you inherit is an *LLM agent* rather than a human?"}, {"id": "wonderos", "name": "WonderOS / Alexander Obenauer — Softland's ontology, built as an operating system", "short": "WonderOS — itemized OS", "body": "An independent research project (Obenauer) in which **everything is an \"item\"**, and the system deliberately separates three layers: **items** (the data/content), **interfaces** (how items are rendered), and **services** (what supplies new items). \"Operators\" — unlike passive \"users\" — can rearrange and evolve the whole system, in big ways and small. This is a near-exact structural twin of Softland's split: object-container kernel (items) / projection (interfaces) / ingestors (services), and the principle \"the event log is truth, rendered state is projection.\" It is convergent evidence that Softland's ontology is a real attractor, not an idiosyncrasy.", "steal": "the items / interfaces / services tripartition as a clean *public vocabulary*; the \"operator vs user\" framing for the renovation thesis.", "avoid": "WonderOS is explicitly \"explorative, not prescriptive\" — a probe, not a shipping product (the EUP shipping problem, thread 5). Radical consistency risks uniform \"soup\" (the desert-fog risk, thread 2).", "open": "does \"everything is an item\" survive scale while staying *navigable* (landmarks/legibility, thread 6)?"}, {"id": "folk", "name": "Folk Computer / Omar Rizwan — provenance-and-context as a computing stance", "short": "Folk Computer — provenance stance", "body": "Rizwan (ex-Dynamicland) builds physical/communal computing — Folk Computer is a reactive database + programming environment + projection mapping — and articulates a philosophy centered on **\"provenance and context throughout computing systems\"**: understanding \"how the thing was made / the soil that it grew in / the context in which it's actually valid.\" That is \"papers as logs / how did we get here\" stated by a systems hacker. His tools embody it: **Screenotate** captures provenance (source URL, window title) *with* every screenshot; **TabFS** exposes browser tabs as filesystem objects. He champions \"folk practices\" — software should embrace what people already do (take screenshots, build spreadsheets), not fight it.", "steal": "provenance-captured-*with*-content as a default, not an afterthought; \"embrace folk practices\" (ingest what people already make).", "avoid": "Folk Computer / Dynamicland are communal and physical *by design* and deliberately do not scale — a research culture, not a product (the recurring EUP non-spread problem, thread 5).", "open": "how to keep provenance \"live and valid\" as content is transformed/compressed across zoom levels (honest semantic zoom, thread 10)."}, {"id": "apparatus", "name": "Apparatus / Toby Schachman — using *is* authoring", "short": "Apparatus — using = authoring", "body": "Schachman (Dynamicland / HARC) built Recursive Drawing (2012), **Apparatus** (2015), Shadershop, and Cuttle — tools that *look* like graphics editors but in which manipulating the drawing actually *writes the program* that generates it. This collapses the use/author distinction, which is exactly what Softland's zoom-100 (\"the editor IS the world\") requires: you should not mode-switch from \"using\" to \"coding.\"", "steal": "direct-manipulation authoring where the gesture of *using* produces the *program* — no separate \"code mode.\"", "avoid": "these remained research/niche tools, powerful only in constrained domains (diagrams, CAD) — the explorables authoring-cost / generality problem (thread 4).", "open": "can manipulation-as-programming generalize beyond narrow domains to arbitrary knowledge artifacts?"}], "synthesis": {"exec": "Ten separate literatures, researched independently, keep arriving at the same handful of facts — which is the strongest signal in this whole report. **Softland's core ontology is not idiosyncratic; it is a convergent attractor.** \"The append-only log is truth, the rendered view is a deterministic projection\" shows up as Nelson's versioning+transclusion (1), as local-first CRDT logs with Peritext deriving formatting from stable IDs (5), as functorial data migration over one schema (9), and as WonderOS's items/interfaces/services split and Folk Computer's provenance-everywhere stance (Part II). Four traditions built Softland's data model before Softland did.\n\nThe second convergence is darker and more useful: **every one of these fields was killed, or nearly killed, by the same thing — the cost of formalization paid upfront for a payoff that arrives later, to someone else.** Distill died of 100-hour hand-authored articles (4); end-user programming stalled at Ko's \"abstraction barrier\" because users rationally refuse speculative structuring effort (5); IBIS/gIBIS died of premature formalization and the value-lag where the capturer pays and a future reader benefits (7); note apps drown in the \"collector's fallacy\" (1). This is *one wall*, hit by five fields. Softland's two bets against it — **incremental formalization** (let structure emerge, suggest typing, never demand it — Marshall & Shipman, thread 7) and **LLM/JIT generation as authoring-cost collapse** (thread 4) — are therefore not features; they are the entire viability question.\n\nThe third convergence is the calibration constraint: **a projection that asserts structure the underlying truth doesn't contain is \"an optimistic-state bug rendered as terrain\"** (thread 8's phrase, but it is thread 2's desert fog, thread 9's `owl:sameAs` critique, thread 10's \"generalize without lying,\" and thread 4's \"cheap explorables that are subtly wrong\" all at once). And the fourth: **nobody in any of these fields can measure success** — QWAN (6), insight (8), CT-vs-OWL benchmarks (9) are all unmeasured after decades. Softland inherits all four. The rest of this section is the wiring.", "connections": ["**One argumentation lineage feeds Softland's data model, and it merges with the hypertext lineage.** Toulmin (1958) → Rittel's IBIS + wicked problems (1973) → Conklin's gIBIS/Compendium → Joel Chan's discourse graphs (7) *is* the ancestry of Q→C→E→D→R→F. It meets thread 1 at the link: Nelson's **bidirectional links are discourse edges**. The discourse graph is the hypertext dream with *typed* relations.", "**Information foraging explains why zoomable UIs fail.** Thread 3's \"information scent\" (Pirolli & Card 1999) and thread 2's \"desert fog\" (Jul & Furnas 1998) are the same phenomenon: desert fog is *the absence of scent at a scale band*. Thread 2's hardest open problem — knowing what's semantically zoomable, and what you'll find, *before* you travel — is literally \"scent across zoom levels,\" and it can only be honest if it also carries epistemic status (thread 8 calibration). **Desert fog + lawful compression + affordance are one combined constraint** the literature leaves open.", "**The append-log ontology unifies threads 1, 5, and 9 mathematically.** Nelson's permanent versioning (1) = the local-first CRDT edit-log (5) = the schema you run Δ/Σ/Π migration functors over (9). **Functorial data migration is the rigorous form of \"one ontology, many projections,\"** and Pijul's pushout-based merges are its one deployed analogue — the *same* universal-construction math the braid (commits + discourse + tickets) needs to merge sources without losing identity.", "**Alexander's pattern-language failure and malleable software's failure are the same warning.** A static catalogue without a generative grammar (GoF, thread 6) and a creation tool without a distribution/composition layer (HyperCard, thread 5) both die; the Oregon Experiment (6) adds that generative structure without sustained institutional ownership reverts to fixity. Softland's \"self-modifying renovation\" needs a **generative grammar + a maintenance mechanism**, not a manifesto.", "**Cartographic generalization is the formal model for honest semantic zoom.** Thread 10's \"simplify representation as scale decreases *without lying*\" is lawful compression; the t-SNE distance-distortion failure (8) and desert fog (2) are both violations of it. Thread 10's open problem — *compute* semantic-importance from the data instead of a cartographer's tacit hand — is thread 2's affordance problem in another vocabulary.", "**The killer use case sits at the intersection of 1 + 3 + 4 + 7.** \"How did we get here\" = Bush's Memex trail (1), structured as the sensemaking dual-loop's shoebox→evidence→schema (3), rendered as a perturbable reactive document (4), with typed discourse edges braiding commits/tickets/claims (7).", "**One wall, one escape, one risk, repeated.** Explorables' authoring cost (4) = tools-for-thought's public-goods problem (1) = EUP's abstraction barrier (5): all the same wall. The proposed escape is always the same (generation collapses the cost). The risk is always the same (cheap generation reintroduces the calibration problem, 8)."], "tensions": ["**Rediscovery vs. reuse** — empirically backed *both ways*: Liu et al.'s N=1,222 RCT shows absorbing the effortful loop deskills the user (3), yet Kittur shows inherited *structure* outvalues content for reuse, especially across differing goals (Part II). You cannot maximize \"do the work yourself\" and \"build on others' structure\" at once. **This is the dial under the user's own stated value, and the literature says it's real, not a preference.**", "**Formalization overhead vs. immediate value** — 70 years unsolved (7). Softland's specific wager — log-native + LLM capture makes structure *immediately* useful to its creator, closing the value-lag at the source — is exactly the hypothesis the entire IBIS→discourse-graph lineage has been unable to confirm.", "**Frame strongly enough to be legible vs. weakly enough to preserve rediscovery** — the insight-vs-communication tension (Kosara/Mackinlay, thread 8) meets Lynch's legible-to-a-stranger imageability (6). A causal narrative must be framed to be readable without foreclosing the rediscovery the user values (back to tension 1).", "**Honest projection vs. compelling projection** — any zoom/layout implying proximity the causal DAG lacks is a calibration bug (2, 8, 9, 10). Beauty and truth diverge here.", "**Ship-now vs. get-it-right** — Xanadu died of over-specification (1), CT shipped a framework with no authoring tool for twelve years (9), the Oregon Experiment collapsed without maintenance (6); but \"worse is better\" cost the Web the transclusion/versioning it still lacks (1).", "**Who sustains it** — public good, no moat, no business model, no access-control story for CRDTs (filled only recently by Keyhive), no maintenance mechanism (1, 4, 5, 6).", "**Can it be measured at all** — QWAN, insight, and CT-vs-baseline benchmarks are all unmeasured after decades (6, 8, 9)."], "directives": ["**Event-log is the one truth; every view is a deterministic projection of it** — and prove it concretely (Peritext's derive-from-stable-IDs), discipline it formally (functorial migration: define what \"the same fact, projected\" means). *[1, 5, 9, WonderOS]*", "**Never demand formalization upfront. Let structure emerge from informal/spatial input and *suggest* typing.** Incremental formalization is the single most-cited escape from the wall that killed five fields. *[7, 5, 4]*", "**Collapse authoring cost with LLM/JIT generation — but reconcile every generated artifact against the causal DAG.** Cheap-but-subtly-wrong is worse than absent. *[4, 5, 8]*", "**Every glyph at every zoom must carry an honest scent of the value *and epistemic status* (fact/hypothesis/guess) behind it.** Solve desert-fog + affordance + calibration as one constraint. *[2, 3, 8, 10]*", "**Treat semantic zoom as cartographic generalization, not pixel scaling** — re-derive representations from truth at each scale; simplify without lying. *[2, 10, 8]*", "**Ship a generative grammar plus a maintenance mechanism, never a static catalogue plus a manifesto.** *[6, 5]*", "**Ship one slice continuously; resist cosmic-scale-before-one-user.** Xanadu and the olog tool-gap are the cautionary corpses. *[1, 9]*", "**Make the structure immediately useful to the person creating it** — close the value-lag at the source. This is Softland's central, still-unconfirmed wager; treat it as the thing to validate first. *[7]*", "**Preserve disagreement as a design law, not a slogan** (Chan's agonistic stance). *[7]*", "**Choose a falsifiable success metric now**: \"does the braid measurably reduce a reader's private reconstruction cost?\" — head-to-head against the plain-prose-plus-git baseline it claims to beat (CT's fatal missing benchmark; CatColab's public \"100 weekly users by mid-2026\" is the model). *[6, 8, 9]*", "**AI as material in a dual loop** — direct-manipulation inner loop for the work, LLM-as-\"local-developer\" outer loop for tool synthesis; never replace manipulation with chat. *[5]*", "**Plan governance/access-control/moderation for when relations go public** — bidirectional links carry a governance cost, and CRDTs had no access-control story until Keyhive (2025). *[1, 5]*"]}, "edges": [[1, 4], [1, 5], [1, 7], [1, 9], [2, 3], [2, 8], [2, 10], [3, 8], [4, 5], [4, 8], [5, 6], [5, 9]]};</script>
<script>
(function(){
'use strict';
const D = window.DATA;
const FAM = {media:'fam-media',sense:'fam-sense',space:'fam-space',rep:'fam-rep'};
const view = document.getElementById('view');
const main = document.getElementById('main');
const menuBtn = document.getElementById('menubtn'), aside = document.getElementById('sidebar'), scrim = document.getElementById('scrim');
function closeDrawer(){ if(aside) aside.classList.remove('open'); if(scrim) scrim.classList.remove('on'); }
if(menuBtn) menuBtn.addEventListener('click',()=>{ aside.classList.toggle('open'); scrim.classList.toggle('on'); });
if(scrim) scrim.addEventListener('click', closeDrawer);

/* ---------- markdown ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  s=s.replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,;:)]|$)/g,'$1<em>$2</em>');
  return s;
}
function refs(s){
  s=s.replace(/\(threads?\s+([0-9][0-9,\sand]*?)\)/g,(m,nums)=>{
    const ps=nums.split(/[,\s]+|and/).filter(x=>/^\d+$/.test(x));
    if(!ps.length) return m;
    const lead=m.indexOf('threads')>-1?'threads ':'thread ';
    return '('+lead+ps.map(n=>'<a href="#/t/'+n+'" class="tref">'+n+'</a>').join(', ')+')';
  });
  s=s.replace(/\*\[([0-9][0-9,\s]*?)\]\*/g,(m,nums)=>{
    const ps=nums.split(/[,\s]+/).filter(x=>/^\d+$/.test(x));
    return '<span class="tags">'+ps.map(n=>'<a href="#/t/'+n+'" class="chip">T'+n+'</a>').join('')+'</span>';
  });
  return s;
}
function block(t){return refs(inline(esc(t)));}
function md(src){
  if(!src) return '';
  const blocks=src.replace(/\r/g,'').split(/\n{2,}/);
  let h='';
  for(let raw of blocks){
    const b=raw.replace(/\s+$/,'');
    if(!b.trim()) continue;
    if(/^#{2,6}\s/.test(b)){const m=b.match(/^(#{2,6})\s+([\s\S]*)$/);const lv=Math.min(m[1].length+1,6);h+='<h'+lv+'>'+block(m[2])+'</h'+lv+'>';continue;}
    if(/^>\s?/.test(b)){h+='<blockquote>'+block(b.replace(/^>\s?/gm,''))+'</blockquote>';continue;}
    if(/^---+\s*$/.test(b)){h+='<hr>';continue;}
    if(/^\s*\d+\.\s/.test(b)){const it=b.split(/\n(?=\s*\d+\.\s)/);h+='<ol>'+it.map(i=>'<li>'+block(i.replace(/^\s*\d+\.\s/,''))+'</li>').join('')+'</ol>';continue;}
    if(/^\s*[-*]\s/.test(b)){const it=b.split(/\n(?=\s*[-*]\s)/);h+='<ul>'+it.map(i=>'<li>'+block(i.replace(/^\s*[-*]\s/,''))+'</li>').join('')+'</ul>';continue;}
    h+='<p>'+block(b)+'</p>';
  }
  return h;
}

/* ---------- sidebar ---------- */
function buildSidebar(){
  const famOf={};(D.threads||[]).forEach(t=>famOf[t.num]=t.family);
  let h='';
  h+='<div class="navsec"><div class="navlink" data-go="#/overview"><span class="n">◇</span>Overview map</div>'+
     '<div class="navlink" data-go="#/about"><span class="n">i</span>About this report</div></div>';
  h+='<div class="navsec"><h4>The Ten Threads</h4>';
  (D.threads||[]).forEach(t=>{h+='<div class="navlink '+FAM[t.family]+'" data-go="#/t/'+t.num+'"><span class="n">'+t.num+'</span>'+esc(t.title.replace(/^\d+\.\s*/,''))+'</div>';});
  h+='</div>';
  h+='<div class="navsec"><h4>Supplementary</h4>';
  (D.supplementary||[]).forEach(s=>{h+='<div class="navlink" data-go="#/s/'+s.id+'"><span class="n">+</span>'+esc(s.short)+'</div>';});
  h+='</div>';
  h+='<div class="navsec"><h4>Synthesis</h4>'+
     '<div class="navlink" data-go="#/exec"><span class="n">§</span>Executive synthesis</div>'+
     '<div class="navlink" data-go="#/connections"><span class="n">⇄</span>Cross-thread connections</div>'+
     '<div class="navlink" data-go="#/tensions"><span class="n">⚡</span>Tensions inherited</div>'+
     '<div class="navlink" data-go="#/directives"><span class="n">★</span>Directives ('+((D.synthesis&&D.synthesis.directives||[]).length)+')</div></div>';
  document.getElementById('sidebar').innerHTML=h;
}
function setActive(hash){
  document.querySelectorAll('.navlink').forEach(n=>n.classList.toggle('active',n.getAttribute('data-go')===hash));
}

/* ---------- views ---------- */
function threadByNum(n){return (D.threads||[]).find(t=>String(t.num)===String(n));}
function famLabel(f){return ({media:'Media for thought',sense:'Sensemaking & argument',space:'Space & navigation',rep:'Representation & rigor'})[f]||f;}

function renderOverview(){
  const fams=[['media','Media for thought'],['sense','Sensemaking & argument'],['space','Space & navigation'],['rep','Representation & rigor']];
  let h='<div class="crumb">home</div><h1 class="title ovhead">The Ten Threads</h1>';
  h+='<div class="ovsub">'+esc(D.meta&&D.meta.tagline||'Ten lineages of how people have tried to hold understanding. Click any node to enter it; lines are the cross-thread connections.')+'</div>';
  h+='<div class="legend">';
  fams.forEach(f=>{h+='<span><i class="dot" style="background:var(--'+({media:'fam-media',sense:'fam-sense',space:'fam-space',rep:'fam-rep'})[f[0]]+')"></i>'+f[1]+'</span>';});
  h+='</div><div class="map" id="map"><svg class="edges" id="edges"></svg>';
  fams.forEach(f=>{
    const ts=(D.threads||[]).filter(t=>t.family===f[0]);
    if(!ts.length) return;
    h+='<div class="family"><div class="fl">'+f[1]+'</div><div class="famrow">';
    ts.forEach(t=>{h+='<div class="node '+FAM[t.family]+'" id="node-'+t.num+'" data-go="#/t/'+t.num+'">'+
      '<div class="nn">THREAD '+t.num+'</div><div class="nt">'+esc(t.title.replace(/^\d+\.\s*/,''))+'</div>'+
      '<div class="ns">'+esc(t.scent||'')+'</div></div>';});
    h+='</div></div>';
  });
  h+='</div>';
  // entry tiles for Part II / III
  h+='<h3 style="font-family:var(--mono);color:var(--ink-faint);font-size:12px;letter-spacing:1.5px;margin-top:10px">ALSO IN HERE</h3><div class="tiles">';
  h+='<div class="tile" data-go="#/connections"><div class="tl">⇄ Cross-thread connections</div><div class="td">how the lineages wire together</div></div>';
  h+='<div class="tile" data-go="#/tensions"><div class="tl">⚡ Tensions Softland inherits</div><div class="td">the unresolved conflicts</div></div>';
  h+='<div class="tile" data-go="#/directives"><div class="tl">★ Consolidated directives</div><div class="td">what to actually do, tagged by thread</div></div>';
  (D.supplementary||[]).forEach(s=>{h+='<div class="tile" data-go="#/s/'+s.id+'"><div class="tl">+ '+esc(s.short)+'</div><div class="td">supplementary node</div></div>';});
  h+='</div>';
  view.innerHTML=h;
  requestAnimationFrame(drawEdges);
}
function drawEdges(){
  const svg=document.getElementById('edges'),mapEl=document.getElementById('map');
  if(!svg||!mapEl) return;
  const mr=mapEl.getBoundingClientRect();
  svg.setAttribute('viewBox','0 0 '+mr.width+' '+mr.height);
  const ctr=n=>{const el=document.getElementById('node-'+n);if(!el)return null;const r=el.getBoundingClientRect();return{x:r.left-mr.left+r.width/2,y:r.top-mr.top+r.height/2};};
  let s='';
  (D.edges||[]).forEach(e=>{const a=ctr(e[0]),b=ctr(e[1]);if(!a||!b)return;
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2-22;
    s+='<path d="M'+a.x+' '+a.y+' Q'+mx+' '+my+' '+b.x+' '+b.y+'" fill="none" stroke="#3a4150" stroke-width="1" opacity="0.5"/>';});
  svg.innerHTML=s;
}
window.addEventListener('resize',()=>{if(location.hash.replace('#','')===''||location.hash==='#/overview')drawEdges();});

function renderThread(n){
  const t=threadByNum(n); if(!t){renderOverview();return;}
  const conns=(D.edges||[]).filter(e=>String(e[0])===String(n)||String(e[1])===String(n))
     .map(e=>String(e[0])===String(n)?e[1]:e[0]);
  const uniq=[...new Set(conns)].map(threadByNum).filter(Boolean);
  let h='<div class="crumb"><a href="#/overview">overview</a> › '+famLabel(t.family)+'</div>';
  h+='<h1 class="title">'+esc(t.title)+'</h1>';
  if(t.scent)h+='<div class="scentline">'+esc(t.scent)+'</div>';
  h+='<div class="body">'+md(t.body)+'</div>';
  if(t.steal||t.avoid||t.open){
    h+='<div class="cards">';
    if(t.steal)h+='<div class="card steal"><div class="lab">steal</div>'+md(t.steal)+'</div>';
    if(t.avoid)h+='<div class="card avoid"><div class="lab">avoid</div>'+md(t.avoid)+'</div>';
    if(t.open)h+='<div class="card open"><div class="lab">open question</div>'+md(t.open)+'</div>';
    h+='</div>';
  }
  if(uniq.length){h+='<div style="font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--ink-faint);margin-top:24px">CONNECTS TO</div><div class="connlist">';
    uniq.forEach(u=>{h+='<a href="#/t/'+u.num+'">'+u.num+'. '+esc(u.title.replace(/^\d+\.\s*/,''))+'</a>';});h+='</div>';}
  const prev=threadByNum(+n-1),next=threadByNum(+n+1);
  h+='<div class="pager">';
  h+=prev?'<a href="#/t/'+prev.num+'"><span class="k">← thread '+prev.num+'</span>'+esc(prev.title.replace(/^\d+\.\s*/,''))+'</a>':'<a href="#/overview"><span class="k">←</span>overview</a>';
  h+=next?'<a class="r" href="#/t/'+next.num+'"><span class="k">thread '+next.num+' →</span>'+esc(next.title.replace(/^\d+\.\s*/,''))+'</a>':'<a class="r" href="#/exec"><span class="k">synthesis →</span>executive synthesis</a>';
  h+='</div>';
  view.innerHTML=h; main.scrollTop=0;
}
function renderSupp(id){
  const s=(D.supplementary||[]).find(x=>x.id===id); if(!s){renderOverview();return;}
  let h='<div class="crumb"><a href="#/overview">overview</a> › supplementary</div><h1 class="title">'+esc(s.name)+'</h1>';
  h+='<div class="body">'+md(s.body)+'</div>';
  if(s.steal||s.avoid||s.open){h+='<div class="cards">';
    if(s.steal)h+='<div class="card steal"><div class="lab">steal</div>'+md(s.steal)+'</div>';
    if(s.avoid)h+='<div class="card avoid"><div class="lab">avoid</div>'+md(s.avoid)+'</div>';
    if(s.open)h+='<div class="card open"><div class="lab">open question</div>'+md(s.open)+'</div>';h+='</div>';}
  view.innerHTML=h; main.scrollTop=0;
}
function renderExec(){
  let h='<div class="crumb"><a href="#/overview">overview</a> › synthesis</div><h1 class="title">Executive Synthesis</h1>';
  h+='<div class="body">'+md(D.synthesis&&D.synthesis.exec||'')+'</div>';
  h+='<div class="pager"><a href="#/overview"><span class="k">←</span>overview</a><a class="r" href="#/connections"><span class="k">next →</span>cross-thread connections</a></div>';
  view.innerHTML=h; main.scrollTop=0;
}
function renderConnections(){
  let h='<div class="crumb"><a href="#/overview">overview</a> › synthesis</div><h1 class="title">Cross-Thread Connections</h1>';
  h+='<div class="ovsub">The real lineages and dependencies between threads.</div><div class="listcards">';
  (D.synthesis&&D.synthesis.connections||[]).forEach((c,i)=>{h+='<div class="lc">'+md(c)+'</div>';});
  h+='</div><div class="pager"><a href="#/exec"><span class="k">←</span>executive synthesis</a><a class="r" href="#/tensions"><span class="k">next →</span>tensions</a></div>';
  view.innerHTML=h; main.scrollTop=0;
}
function renderTensions(){
  let h='<div class="crumb"><a href="#/overview">overview</a> › synthesis</div><h1 class="title">Tensions Softland Inherits</h1><div class="listcards">';
  (D.synthesis&&D.synthesis.tensions||[]).forEach((t,i)=>{h+='<div class="lc"><div class="lcn">tension '+(i+1)+'</div>'+md(t)+'</div>';});
  h+='</div><div class="pager"><a href="#/connections"><span class="k">←</span>connections</a><a class="r" href="#/directives"><span class="k">next →</span>directives</a></div>';
  view.innerHTML=h; main.scrollTop=0;
}
function renderDirectives(){
  let h='<div class="crumb"><a href="#/overview">overview</a> › synthesis</div><h1 class="title">Consolidated Softland Directives</h1>';
  h+='<div class="ovsub">What to actually do. Each tag links to the thread it comes from.</div><div class="listcards">';
  (D.synthesis&&D.synthesis.directives||[]).forEach((t,i)=>{h+='<div class="lc"><div class="lcn">directive '+(i+1)+'</div>'+md(t)+'</div>';});
  h+='</div><div class="pager"><a href="#/tensions"><span class="k">←</span>tensions</a><a class="r" href="#/overview"><span class="k">↑</span>back to map</a></div>';
  view.innerHTML=h; main.scrollTop=0;
}
function renderAbout(){
  const m=D.meta||{};
  let h='<div class="crumb"><a href="#/overview">overview</a> › about</div><h1 class="title">About this report</h1>';
  h+='<div class="body">'+md(m.status||'')+md(m.method||'')+md(m.provenance||'')+'</div>';
  h+='<div class="pager"><a href="#/overview"><span class="k">←</span>overview</a><a class="r" href="#/t/1"><span class="k">start →</span>thread 1</a></div>';
  view.innerHTML=h; main.scrollTop=0;
}

/* ---------- search ---------- */
const idx=[];
(D.threads||[]).forEach(t=>idx.push({k:'Thread '+t.num,t:t.title,go:'#/t/'+t.num,blob:(t.title+' '+t.scent+' '+t.body+' '+t.steal+' '+t.avoid+' '+t.open).toLowerCase()}));
(D.supplementary||[]).forEach(s=>idx.push({k:'Supplementary',t:s.name,go:'#/s/'+s.id,blob:(s.name+' '+s.body+' '+s.steal+' '+s.avoid+' '+s.open).toLowerCase()}));
(D.synthesis&&D.synthesis.directives||[]).forEach((t,i)=>idx.push({k:'Directive '+(i+1),t:t.replace(/\*|_|`/g,'').slice(0,90),go:'#/directives',blob:t.toLowerCase()}));
(D.synthesis&&D.synthesis.tensions||[]).forEach((t,i)=>idx.push({k:'Tension '+(i+1),t:t.replace(/\*|_|`/g,'').slice(0,90),go:'#/tensions',blob:t.toLowerCase()}));
(D.synthesis&&D.synthesis.connections||[]).forEach((t,i)=>idx.push({k:'Connection',t:t.replace(/\*|_|`/g,'').slice(0,90),go:'#/connections',blob:t.toLowerCase()}));
const sIn=document.getElementById('search'),sRes=document.getElementById('results');
function doSearch(){
  const q=sIn.value.trim().toLowerCase();
  if(q.length<2){sRes.classList.remove('on');sRes.innerHTML='';return;}
  const hits=idx.filter(x=>x.blob.includes(q)).slice(0,40);
  if(!hits.length){sRes.innerHTML='<div class="res"><span class="t">no matches</span></div>';sRes.classList.add('on');return;}
  sRes.innerHTML=hits.map(x=>{
    let snip='';const p=x.blob.indexOf(q);
    if(p>-1){const a=Math.max(0,p-40);snip='…'+x.blob.slice(a,p)+'<em>'+x.blob.slice(p,p+q.length)+'</em>'+x.blob.slice(p+q.length,p+q.length+50)+'…';}
    return '<div class="res" data-go="'+x.go+'"><div class="k">'+esc(x.k)+'</div><div class="t">'+esc(x.t)+'</div><div class="k" style="text-transform:none;color:var(--ink-faint)">'+snip+'</div></div>';
  }).join('');
  sRes.classList.add('on');
}
sIn.addEventListener('input',doSearch);
document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))sRes.classList.remove('on');});

/* ---------- routing ---------- */
function route(){
  const hash=location.hash||'#/overview';
  const m=hash.match(/^#\/(\w+)(?:\/(.+))?/);
  const k=m?m[1]:'overview',arg=m?m[2]:null;
  if(k==='t')renderThread(arg);
  else if(k==='s')renderSupp(arg);
  else if(k==='exec')renderExec();
  else if(k==='connections')renderConnections();
  else if(k==='tensions')renderTensions();
  else if(k==='directives')renderDirectives();
  else if(k==='about')renderAbout();
  else renderOverview();
  setActive(hash==='#/'?'#/overview':hash);
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();sRes.classList.remove('on');sIn.value='';closeDrawer();location.hash=g.getAttribute('data-go');}});
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==sIn){e.preventDefault();sIn.focus();return;}
  if(document.activeElement===sIn) {if(e.key==='Escape'){sIn.blur();sRes.classList.remove('on');} return;}
  const m=(location.hash||'').match(/^#\/t\/(\d+)/);
  if(m){const n=+m[1];if(e.key==='ArrowRight'&&threadByNum(n+1))location.hash='#/t/'+(n+1);
    if(e.key==='ArrowLeft'&&threadByNum(n-1))location.hash='#/t/'+(n-1);}
});

buildSidebar();
route();
})();
</script>
</body>
