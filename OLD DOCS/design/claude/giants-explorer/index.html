<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giants — Explorable Research Map</title>
<style>
:root{
  --bg:#0d0e12; --panel:#15171f; --panel2:#1b1e28; --line:#2a2e3a;
  --ink:#dce0e8; --ink-dim:#9aa3b2; --ink-faint:#6b7385;
  --accent:#7cc7ff; --accent2:#b79cff;
  --steal:#5fd08a; --avoid:#ff7a85; --open:#ffce6a;
  --fam-media:#7cc7ff; --fam-sense:#b79cff; --fam-space:#5fd0c0; --fam-rep:#ffb86b;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6;
  display:grid;grid-template-columns:280px 1fr;grid-template-rows:56px 1fr;
  grid-template-areas:"head head" "side main";height:100vh;overflow:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.86em;background:#0a0b0e;border:1px solid var(--line);border-radius:4px;padding:.05em .35em}
h1,h2,h3,h4{font-family:var(--mono);font-weight:600;line-height:1.25}
hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
blockquote{border-left:3px solid var(--line);margin:1em 0;padding:.2em 1em;color:var(--ink-dim);background:var(--panel)}

/* header */
header{grid-area:head;display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:30}
.brand{font-family:var(--mono);font-weight:700;letter-spacing:.5px;color:var(--ink)}
.brand b{color:var(--accent)}
.brand .sub{color:var(--ink-dim);font-weight:400}
#menubtn{display:none;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;font-size:18px;line-height:1;padding:6px 12px;cursor:pointer}
#scrim{display:none}
.searchwrap{margin-left:auto;position:relative;width:min(420px,46vw)}
#search{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:13px}
#search:focus{outline:none;border-color:var(--accent)}
#results{position:absolute;top:42px;right:0;left:0;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;max-height:60vh;overflow:auto;display:none;z-index:40;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#results.on{display:block}
.res{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.res:hover{background:var(--panel)}
.res .k{font-family:var(--mono);color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.res .t{color:var(--ink)}
.res em{color:var(--accent);font-style:normal;background:rgba(124,199,255,.13)}

/* sidebar */
aside{grid-area:side;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 10px}
.navsec{margin:6px 4px 16px}
.navsec h4{margin:0 6px 7px;color:var(--ink-faint);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.navlink{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink-dim);font-size:14px;font-family:var(--serif)}
.navlink:hover{background:var(--panel2);color:var(--ink)}
.navlink.active{background:var(--panel2);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
.navlink .n{font-family:var(--mono);font-size:11px;color:var(--ink-faint);min-width:20px}
.navlink.fam-media .n{color:var(--fam-media)} .navlink.fam-sense .n{color:var(--fam-sense)}
.navlink.fam-space .n{color:var(--fam-space)} .navlink.fam-rep .n{color:var(--fam-rep)}

/* main */
main{grid-area:main;overflow:auto;scroll-behavior:smooth}
.wrap{max-width:880px;margin:0 auto;padding:30px 40px 120px}
.crumb{font-family:var(--mono);font-size:12px;color:var(--ink-faint);margin-bottom:14px}
.crumb a{color:var(--ink-faint)}
.title{font-size:30px;margin:.1em 0 .1em;color:var(--ink)}
.scentline{font-size:18px;color:var(--ink-dim);font-style:italic;margin:.2em 0 1.2em;border-left:3px solid var(--line);padding-left:14px}
.body p{margin:.85em 0}
.body h3{font-size:18px;margin:1.5em 0 .4em;color:var(--accent2)}
.body h4{font-size:15px;margin:1.2em 0 .3em;color:var(--ink)}
.body ul,.body ol{padding-left:1.3em}
.body li{margin:.35em 0}
.tref{font-family:var(--mono);font-size:.85em;background:rgba(124,199,255,.12);border:1px solid rgba(124,199,255,.3);
  border-radius:4px;padding:0 .35em;color:var(--accent)}
.tags{display:inline-flex;gap:5px;flex-wrap:wrap;vertical-align:middle}
.chip{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:1px 8px;color:var(--ink-dim)}
a.chip:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}

/* For-Softland cards */
.cards{display:grid;gap:12px;margin:22px 0}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel)}
.card .lab{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.card.steal{border-left:4px solid var(--steal)} .card.steal .lab{color:var(--steal)}
.card.avoid{border-left:4px solid var(--avoid)} .card.avoid .lab{color:var(--avoid)}
.card.open{border-left:4px solid var(--open)} .card.open .lab{color:var(--open)}

.connlist{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.connlist a{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;color:var(--ink-dim)}
.connlist a:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}

.pager{display:flex;justify-content:space-between;margin-top:36px;gap:12px}
.pager a{flex:1;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel);color:var(--ink-dim);font-size:13px}
.pager a:hover{border-color:var(--accent);text-decoration:none}
.pager .r{text-align:right}
.pager .k{font-family:var(--mono);font-size:11px;color:var(--ink-faint);display:block}

/* overview map */
.ovhead{margin-bottom:6px}
.ovsub{color:var(--ink-dim);font-style:italic;margin-bottom:24px}
.map{position:relative}
.map svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.family{position:relative;z-index:1;margin:0 0 26px}
.family .fl{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 10px;color:var(--ink-faint)}
.famrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.node{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--panel);cursor:pointer;position:relative}
.node:hover{border-color:var(--accent);background:var(--panel2)}
.node .nn{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.node .nt{font-weight:600;font-family:var(--mono);font-size:13.5px;margin:3px 0 6px;color:var(--ink)}
.node .ns{font-size:13px;color:var(--ink-dim);line-height:1.45}
.node.fam-media{box-shadow:inset 3px 0 0 var(--fam-media)} .node.fam-sense{box-shadow:inset 3px 0 0 var(--fam-sense)}
.node.fam-space{box-shadow:inset 3px 0 0 var(--fam-space)} .node.fam-rep{box-shadow:inset 3px 0 0 var(--fam-rep)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:8px}
.tile{border:1px dashed var(--line);border-radius:10px;padding:14px;cursor:pointer;background:var(--panel)}
.tile:hover{border-color:var(--accent2);border-style:solid}
.tile .tl{font-family:var(--mono);font-size:13px;color:var(--accent2);margin-bottom:4px}
.tile .td{font-size:12.5px;color:var(--ink-dim)}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin:8px 0 22px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

.listcards{display:grid;gap:14px}
.lc{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--panel)}
.lc .lcn{font-family:var(--mono);color:var(--accent2);font-size:13px;margin-bottom:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-areas:"head" "main";font-size:15px}
  header{gap:10px;padding:0 12px}
  #menubtn{display:inline-block}
  .brand .sub{display:none}
  .searchwrap{width:auto;flex:1;min-width:0}
  #search{font-size:16px}
  aside{position:fixed;top:56px;bottom:0;left:0;width:84vw;max-width:330px;z-index:60;
    transform:translateX(-102%);transition:transform .18s ease;box-shadow:8px 0 32px rgba(0,0,0,.65)}
  aside.open{transform:translateX(0)}
  #scrim.on{display:block;position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.55);z-index:55}
  .wrap{padding:18px 16px 110px}
  .title{font-size:23px}
  .scentline{font-size:16px}
  .famrow,.tiles{grid-template-columns:1fr}
  .pager{flex-direction:column}
  .body{font-size:16px}
}
</style>

<script>window.DATA = {"meta": {"title": "Giants — Deep Research: Intellectual History + Frontier (for Softland design)", "status": "**Status:** COMPLETE (2026-06-10) — all 10 threads + 4 supplementary nodes + Part III synthesis. The companion to `giants-digest.md` — where the digest was Claude's own distillation, this is web-driven research: each of 10 threads investigated by dedicated agents across three angles (roots / failures-and-roads-not-taken / 2024–2026 frontier), adversarially fact-checked, then synthesized. Independent cut; not yet reconciled with `charter.md` / `orientation.md` / `malleable-software/` / the `codex/` track.\n\n**Method note:** Research agents (Sonnet) ran live WebSearch + WebFetch, preferring primary sources; a fact-check agent per thread tried to refute the key claims before synthesis; per-thread synthesis (Opus) drops/flags anything refuted. Citations are inline. Where a date or attribution is uncertain it is marked. The supplementary nodes (Part II) were researched directly in the main session.\n\n**Provenance:** threads 1 & 4 + the 4 supplementary nodes researched lean (main-loop); threads 2, 3, 5–10 via the multi-agent deep-research workflow; Part III synthesis grounded in the ten thread closers. See the provenance note at the end of Part III.", "method": "", "provenance": "**Provenance of this report:** Threads 1 & 4 + the four Part II supplementary nodes were researched lean (Claude main-loop WebSearch/WebFetch). Threads 2, 3, 5–10 came from the multi-agent deep-research workflow (40 agents, adversarial fact-checking; the run that finally succeeded after three usage-limit/power failures — see `memory/deep-research-workflow-limits.md`). Part III synthesis is Claude's, grounded in the ten thread closers. **Not yet reconciled** with `charter.md` / `orientation.md` / `malleable-software/` / the `codex/` track — that reconciliation is the natural next step.", "tagline": "Ten lineages of how people have tried to hold understanding in a form another mind can inhabit. Click any node to enter; the lines are the cross-thread connections — drawn, never inferred."}, "threads": [{"num": 1, "title": "1. Augmentation & Hypertext Lineage", "family": "media", "scent": "Bush → Engelbart → Nelson. Xanadu's quartet (transclusion, bidirectional links, permanent versioning, provenance) is your ontology — but it never shipped; the Web won by deliberately keeping less.", "body": "**The narrative.** The thread begins not with a computer but an essay: Vannevar Bush's \"As We May Think\" (*The Atlantic*, July 1945). Bush imagined the **Memex**, a microfilm desk on which a person builds associative **\"trails\"** — \"any item may be caused at will to select immediately and automatically another.\" That sentence, ~30 years before the PC and ~50 before the Web, is the hyperlink in embryo, and explicitly a model of *augmenting memory by externalizing association*, not automating thought. Its reach was personal: a Navy radar technician, **Douglas Engelbart**, read it in 1945 in the Philippines and made it his life's program. Engelbart's \"Augmenting Human Intellect: A Conceptual Framework\" (1962) proposed co-evolving humans, tools, and methods (the H-LAM/T system) and **bootstrapping** (using the tools to improve the tools), operationalized in NLS and shown in the 1968 \"Mother of All Demos\" (mouse, windows, live hypertext linking, screen-sharing). In parallel, **Ted Nelson** coined \"hypertext\" (1965) and launched **Project Xanadu**, whose model went *further* than anything since: **transclusion** (include by reference — \"the original remains untouched\"), **bidirectional links** (B knows when A points to it), **permanent versioning** (nothing overwritten), and **micropayment/attribution** (authors auto-credited on reuse).\n\n**The debate / what failed and why.** Xanadu became \"the longest-running vaporware project in the history of computing\" (Gary Wolf, \"The Curse of Xanadu,\" *Wired*, 1995) — a ~30-year saga (begun ~1965) that never shipped. Post-mortems converge (Wolf; Jason Crawford, \"The Lessons of Xanadu\"): **over-specification** (universal library + publishing + copyright-resolution + meritocratic forum, all at once), **techno-hubris** (designing for \"quadrillions of individuals over billions of years\" on 128–256 KB machines), perpetual \"six months away\" prototyping with no honest schedule, and refusal to accept constraints. The decisive counter-move was Berners-Lee's Web (1989–91), which **deliberately discarded** Xanadu's guarantees: links are one-way and allowed to break; no transclusion, versioning, or built-in attribution. Xanadu partisans call this \"incorrectly simplifying\"; the dominant verdict is Clay Shirky's **\"worse is better\"** — evolvable imperfect systems improve exponentially, perfect central ones don't, and the Web won *because* it shipped something weak. A subtler, less-told reason the Web dropped bidirectional links: it wasn't only simplicity — **bidirectionality is a moderation nightmare** (\"if every site that linked to yours was visible on your page… the Trollish implications\"), so one-way links were also a *governance* choice (Appleton).\n\n**Cross-thread links.** Bush's \"trails\" are the direct ancestor of Softland's \"papers as logs\" (a saved traversal *is* a Memex trail). Engelbart's *augmentation-not-automation* and bootstrapping anchor thread 5 (malleable/self-modifying software) and thread 4 (Kay/explorables). Nelson's transclusion is \"one ontology, many projections,\" and his bidirectional links are the structural cousin of thread 7's typed discourse-graph edges.\n\n**Frontier (2024–2026).** The \"tools for thought\" renaissance revived Xanadu's buried features: **Roam, Obsidian, Logseq** made **backlinks/bidirectionality** mainstream (Matuschak's public notes popularized \"Links to this note\"; the IndieWeb's **WebMentions**, a W3C recommendation, give opt-in cross-site bidirectionality). But the movement self-critiques sharply: the **\"collector's fallacy\"** (collecting ≠ understanding; \"Why note-taking apps don't make us smarter,\" Casey Newton / Platformer), and Appleton's reframing of tools for thought as **cultural practices, not just software**. Matuschak & Nielsen's \"How can we develop transformative tools for thought?\" (2019) is the manifesto: most such tools fail because design culture lacks an **\"insight-through-making loop\"** (the tool must encode insight into the *subject matter*, not just UX) and because they're a **public good** with no moat (easily cloned, expensive to research — Adobe vs Figma/Sketch), hence chronically underfunded. Notably they *reject* the orthodox \"make your own cards\" claim — arguing expert-authored structure can beat self-authored — a live tension with the rediscovery ideal.", "steal": "Nelson's full quartet (transclusion, bidirectional links, permanent versioning, provenance/attribution) *is* Softland's ontology (event-log truth, one-source-many-projections, \"how did we get here\"). You're knowingly building the Xanadu data model on a substrate (append-only log + object-container) that can actually deliver it — and the tools-for-thought wave proves the appetite now exists.", "avoid": "Xanadu's documented death: over-specification + never shipping + designing for cosmic scale before one user. \"Ship continuously / worse is better\" is the antidote; your one-slice-at-a-time instinct is the correct lesson. (And bidirectional links carry a *governance* cost, not just technical — plan moderation/permission when relations go public.)", "open": "the card-authorship debate: does \"do the work, rediscover it\" survive when high-quality pre-built structure exists, or does inheriting structure (Kittur: organization > content for reuse) win? You can't maximize rediscovery *and* reuse — where's the dial?"}, {"num": 2, "title": "2. Zoomable & Spatial User Interfaces", "family": "space", "scent": "Semantic zoom was born here (Pad, 1993) and killed by 'desert fog' — sparse scale-bands with no scent. Forty years of beautiful demos; navigation never solved.", "body": "The dream that animates this thread is almost exactly Softland's: that information could be a *place* you navigate by moving and scaling, rather than a hierarchy you open and close. Its forty-year history is a cautionary one — a paradigm that produced the field's most beautiful demos and its most precise failure diagnoses, and never found the killer application that would have made it the way we compute. Reading it carefully is the single best inoculation against Softland's own most seductive idea.\n\n**The fisheye prehistory.** The lineage begins not with zooming but with George Furnas's answer to the same underlying problem: how to show local detail and global context at once on a small screen. Furnas circulated a Bell Laboratories technical memorandum, \"The FISHEYE View: A New Look at Structured Files\" (#81-11221-9, October 1981), five years before it reached CHI 1986 as \"Generalized Fisheye Views\" (pp. 16–23) — the 1981 date and the five-year gap are both corroborated. His core invention was the **Degree-of-Interest function**: `DOI(x) = API(x) − distance(x, focus)`, where an item's displayed prominence is its *a priori* importance minus its distance from the current focus. Crucially, this is *differential detail allocation* — things near you get more detail, weighted by intrinsic worth — not uniform scaling. Furnas was solving the problem by distorting the display, not by changing scale, and this fork (distortion vs. zoom) would never be cleanly resolved. The deeper ancestor is Ivan Sutherland's Sketchpad (1963 MIT PhD thesis), which permitted scale-change navigation of a drawing on the TX-2 — though there zooming was incidental to constraint-based drawing.\n\n**Pad and the birth of semantic zoom.** The system that made zooming the *organizing principle* of an entire interface was Pad, presented by Ken Perlin and David Fox at SIGGRAPH 1993 (pp. 57–64; date and pagination confirmed). Their argument: the folder-and-window paradigm forces hierarchical \"double-click to get inside\" navigation, which they replaced with an **infinite 2D plane** where every object — files, programs, calendars — coexists, navigated by pan and zoom. Their durable conceptual contribution was the distinction between **geometric zoom** (everything scales proportionally, like a camera) and **semantic zoom** (an object's *content and representation* change with scale — a clock shows seconds only when zoomed in, only the hour hand when zoomed out). Pad uses the term \"semantic zooming\"; whether it was the literal *first* published use is unverifiable — the earliest independently traceable citation in the InfoVis Wiki is a 1997 report, and no source establishes 1993 priority against all contemporaries, so I state the idea's origin here but not its lexical primacy. Their second invention, **portals**, decoupled spatial proximity from visual co-presence: a lens that shows another region of the plane at a different scale, so you can see the same content through multiple magnifications at once.\n\n**Pad++ and \"alternate interface physics.\"** Benjamin Bederson, then at Bellcore in Morristown, redesigned the system as Pad++, presented at UIST 1994 with James Hollan — though I should flag that Hollan was already listed at the University of New Mexico on that paper, so the common framing of \"both moved together from Bellcore to UNM\" is wrong; only Bederson was at Bellcore at publication. The subtitle, \"Exploring Alternate Interface Physics,\" carried the philosophical payload. Bederson and Hollan explicitly rejected **metaphor-based design**: metaphors borrowed from physical objects (desktop, folder, paper document) import the *limitations* of those objects — a paper document doesn't link, zoom, or reorganize. They proposed **informational physics** instead — designing each object's behavior (how it scales, what it shows, how it responds to proximity) as a deliberate epistemic choice \"to provide cognitively facile access,\" not as a simulation of matter. The implementation was serious engineering: a C++ core with Tcl/Tk scripting, R-Tree spatial indexing for region queries at any scale, level-of-detail rendering, and adaptive render scheduling — the same techniques every serious canvas engine still uses.\n\n**Formalizing the failure.** Furnas rejoined to co-author with Bederson \"Space-Scale Diagrams: Understanding Multiscale Interfaces\" (CHI 1995, pp. 234–241), which plots spatial position against magnification so that every pan/zoom traces a *path* through a 2D plane — making the overview-detail tradeoff a literal geometric constraint (you cannot occupy high and low magnification simultaneously). This formalism set up the field's sharpest diagnosis: Susanne Jul and George Furnas, \"Critical Zones in Desert Fog: Aids to Multiscale Navigation\" (UIST 1998, pp. 97–106). **Desert fog** names a view containing \"no information on which to base navigational decisions\" — when you zoom through a scale band between objects that exist at low magnification and objects that exist at high magnification, you see blank canvas with no way to know where you are or which way to go. Their key insight is structural, not ergonomic: *any sufficiently large ZUI with sparsely distributed content produces desert fog by default*. Their fixes (Landmarking, ZTracker — persistent orientation markers and navigation-history trails grouped by objects' *visibility range* rather than spatial position) were partial; the global disorientation problem was never solved. Tellingly, by Furnas and Zhang's \"Illusions of Infinity\" (UIST 2000), the field's leading theorist was proposing perceptual *illusions* to fake the feedback that genuine large-scale navigation requires — a quiet admission the substrate couldn't deliver it honestly.\n\n**The toolkit arc as a parable of over-engineering.** The infrastructure lineage — Pad (1993, C++/Scheme) → Pad++ (C++/Tcl) → Jazz (UIST 2000, a full Java rewrite by Bederson, Meyer, and Good) → Piccolo (a lean rewrite by Jesse Grosjean) → Piccolo2D (open-sourced after UMD ended maintenance in 2008) — follows one shape: theoretical ambition, sprawling prototype, simplification, then abandonment. Piccolo2D's own history page admits Jazz \"grew too big\" with \"a very general design that actually made it somewhat hard to use.\" No commercial product of note ever shipped on this stack. (The term \"ZUI\" itself was coined by Franklin Servan-Schreiber at Sony Research Laboratories in partnership with Bederson and Perlin; secondary sources adding Tom Grauman as co-coiner are not confirmed by the primary record, so I leave him out.)\n\n**The empirical reckoning.** Cockburn, Karlson, and Bederson's \"A Review of Overview+Detail, Zooming, and Focus+Context Interfaces\" (*ACM Computing Surveys* 41(1), 2008) is the field's most rigorous synthesis. Its taxonomy separates *spatial* separation (overview+detail: two views at once), *temporal* separation (zooming: one view, then another), and *distortion-based integration* (focus+context). The damning finding for zooming: because it uses temporal separation, the context and detail views are *never visible simultaneously*, so users must hold a mental model of where they were and reconstruct spatial context after every zoom — a working-memory cost that overview+detail avoids. The review *favored* overview+detail for document comprehension (I deliberately avoid \"consistently outperformed,\" which overstates the paper's more measured conclusion). An earlier Cockburn, Gutwin, and Greenberg study (*ACM TOCHI*, 2006) found error rates \"much higher with zooming than with multiple windows\" specifically on *comparison* tasks — concrete, replicated evidence that zoom incurs costs other patterns simply don't.\n\n**Roads not taken, and why they failed.** Four failures matter, each concrete:\n\nThe *fisheye/focus+context road* (Furnas 1986; Sarkar & Brown's graphical fisheye graphs, 1992) offered distortion as an alternative to zoom: always see everything, compress the periphery. It died of *subjective rejection* — Cockburn et al. found focus+context showed \"mixed results... sometimes outperforming\" alternatives yet drawing \"negative feedback despite good performance,\" because distortion violates the user's assumption that the display is a faithful spatial representation. Users will reject an interface that *feels* wrong even when it measurably helps.\n\nThe *commercial graveyard* is specific: GeoPhoenix's **Zoomspace** on the Sony CLIÉ PDA (2002–03; note the product was \"Zoomspace,\" *not* the \"Zoominator\" some accounts call it), Hillcrest Labs' HoME zooming TV interface (2006), Microsoft Live Labs' Deepfish zooming mobile browser (2007), and Servan-Schreiber's Zoomorama (Flash image browser, alpha 2007, closed 2010). Each was technically sound and commercially inert — the same arc as the toolkits.\n\nBederson's own retrospective, \"The Promise of Zoomable User Interfaces\" (*Behaviour & Information Technology* 30(6), 2011, pp. 853–866), is the insider post-mortem. He concluded the grand vision of a zoomable desktop \"has not materialised\" (I paraphrase deliberately — the often-quoted sentence about zooming \"never materializing as the primary interface\" could not be verified verbatim and may be a confabulation). His three causes are the heart of this thread: (1) **no killer application** — every ZUI had its own zoom triggers and semantic-zoom rules, so no de-facto standard ever taught users the model; (2) **zooming is hard unless the data is fundamentally spatial** — maps work because geography *is* multiscale, but for documents, code, and email, spatial organization is a *user-imposed convention* the user must invent and maintain; (3) **good for demos and overview, bad for daily retrieval** — ZUIs help you grasp structure but don't efficiently answer \"where is X.\" His own framing: a \"cautionary tale\" that impressive demos don't survive sustained, varied use. He named mobile pinch-to-zoom as the one genuine success — because there zoom is a *gesture answering a specific intent*, not a worldview.\n\nThe earlier draft research claimed the original 1993 Pad used non-animated \"jump\" zooming on a SPARCstation, magnifying by a factor of two per click. I am dropping this entirely: no source corroborates the hardware, the discreteness, or the factor-of-two, and secondary descriptions actually emphasize *smooth, continuous* zoom — the detail appears confabulated.\n\n**Prezi: the exception that proves the diagnosis.** Prezi was incorporated in Budapest on May 20, 2009 by Adam Somlai-Fischer, Peter Halacsy, and Peter Arvai (originally \"ZuiPrezi\"), and was the *first company TED ever funded* — both facts confirmed. It reached ~50M users by 2014 and 160M by 2025, the only ZUI success at scale. But it succeeded by *discarding* the ZUI's interactive model: Prezi is a **path-based** slideshow where the author fixes the navigation sequence and the audience merely follows — borrowing ZUI's kinetic *aesthetic* while removing user-directed navigation, which also removes the desert-fog problem (the author owns the path). The cost was physiological: \"Prezi nausea\" / \"Prezilepsy\" entered the practitioner vocabulary by 2011–12, with documented nausea lasting up to an hour. The mechanism is exactly what Cockburn et al. predicted compounded by vestibular conflict: rapid, rotating, large-amplitude zoom transitions read as physical motion to the body even though nothing moves. Ned Potter's guide isolates the culprits — chaotic positioning forcing erratic camera paths, large inter-element distances forcing dramatic excursions, and gratuitous rotation (\"99.9% of rotations and barrel-rolls... add absolutely zero value\"). Prezi is thus *both* the commercial vindication and the clinical demonstration of why unrestrained zoom harms users.\n\n**Cross-disciplinary borrowings and links.** This thread is deeply entangled with the report's other threads. Furnas's DOI function is fundamentally a **lawful-compression** law — display prominence as a function of distance-from-focus — which is exactly what semantic zoom must obey if Softland's zoom is to be honest rather than fake (the *recoverable compression* principle: fold, don't sever). The geometric-vs-semantic distinction maps onto the difference between *rendering* and *projection*: geometric zoom is a camera operation on fixed state; semantic zoom is a re-projection of the same underlying truth at a different altitude — which connects directly to the **event-log-is-truth / rendered-state-is-projection** thread, because only a system whose state is structured (not pixels) can re-derive a genuinely different representation per scale. The **category-theory** thread supplies what Bederson and Hollan never had: a *theory of which information has spatial structure* — functors and natural transformations are precisely the language for \"the same object viewed at a coarser scale,\" and the absence of such a theory is, in Bederson's own diagnosis, why ZUIs couldn't identify their own scope. The modern reframe of the canvas as an *AI prompting surface* (below) connects to the report's discourse-graph and reasoning-trail threads.\n\n**The modern infinite-canvas revival (2019–2026).** The hardware that doomed early ZUIs — slow vector rendering, no GPU 2D, no touch — changed, and a new wave arrived, mostly avoiding the \"ZUI\" label. **Figma** (founded 2012, launched 2016, on WebGL) became dominant but explicitly *re-imposes discrete structure* on the infinite plane — named pages, bookmarkable frames, search — and FigJam added explicit pages in 2024 *because users got lost*; Andy Matuschak's 2023 note calls Figma \"a surprisingly general-purpose infinite canvas\" yet limited by \"no stateful interactivity.\" **Muse** (founded 2019, Adam Wiggins et al., iPad/stylus-first, local-first CRDT with Ink & Switch) made the most intellectually explicit attack on desert fog — boards anchored at a fixed upper-left corner expanding only right and down (\"a spool of paper\"), with off-screen indicators borrowed from open-world games, because multi-directional freedom left users \"disoriented, like floating in an endless white void\" (functionally identical language to Jul & Furnas 1998). Yet Wiggins's 2023 retrospective documents *commercial* failure despite *design* success: active users roughly halved in Q1 2022, the company reached only ~$120k ARR (\"a one-person business, not a team effort\") — the market for premium spatial-thinking tools is simply too small, and \"inventing a new document type is hard.\" **tldraw** (Steve Ruiz, 2021; React/DOM rather than WebGL, trading raw FPS for arbitrary embeddable web content) pivoted to an SDK powering ClickUp, Shopify, Autodesk, Observable, and Claude.ai — the most honest acknowledgment that the canvas *cannot stand alone* and needs a host application's task structure. Its \"Make Real\" (Nov 15, 2023, day after GPT-4V) — sketch a UI, get working HTML in an iframe — drew 22M views in two weeks and reframed the canvas as a *multimodal AI prompting surface* where spatial arrangement creates \"implicit meaning\" superior to a 1D chat thread. tldraw raised a Series A in April 2024 (~$40M pre-money, Lux/Amplify), but its SDK 4.0 commercial license (Sept 2025, ~$6,000/team/year) forced BigBlueButton to fork — a live ecosystem fracture. **Kinopio** (Pirijan Ketheswaran) is the most principled small player: inspired by modular synthesizers, it makes relations explicit via literal \"cables,\" directly answering the unresolved *structural-ambiguity* critique (is proximity meaningful or aesthetic?). **Heptabase** (YC W22) survives in a narrow research/learning niche by making every card a real backlinked Markdown note; **Kosmik** embeds a live Chromium browser in the canvas.\n\n**The academic frontier (2025–2026).** The research community has caught up, and notably has *converged on the canvas-as-AI-surface reframe*. Autodesk Research's \"Protosampling\" (Guo, Ledo, Fitzmaurice, Anderson; CHI 2026) found that users of its Atelier canvas spontaneously organized space into \"hot\" (active) and \"cold\" (archived) zones — a previously undocumented spatial behavior suggesting spatial memory *activates* when the canvas holds generative outputs rather than static content (though n=5, warranting replication). \"Conversations in Space: CanvasConvo\" (Amin et al., arXiv, May 2026) turns LLM chat into branching trees on a canvas; a 5-day study (n=24) scored SUS 78.9, with 96% finding it easy to revisit earlier content and canvas sessions lasting markedly longer than chat. Grotov & Botov's \"Evolving the Computational Notebook\" (arXiv, March 2025) reframes Jupyter's linear cell order as a *spatial design failure*; **Haystack** (YC S24) is an infinite-canvas IDE that auto-draws connections between code files — the narrowest, most defensible thesis (spatial layout as *comprehension aid for codebases*, not universal organization). The countercurrent is Robin Cannon's March 2026 thesis that the canvas is becoming an obsolete *intermediate representation*: if AI agents translate problem statements directly into production-compliant artifacts, the canvas-as-abstraction-layer is overhead — partially validated by Figma's May 2026 native on-canvas AI agent. Apple Vision Pro (Feb 2024), marketed as \"an infinite canvas... beyond the boundaries of a traditional display,\" sold under ~450k units in 2024 and failed by exactly the 1990s pattern: ecosystem-bootstrapping (few apps → few users → few apps), disorientation at a new scale, no killer app.", "steal": "Perlin & Fox's **semantic zoom** (SIGGRAPH 1993) as re-projection of structured truth — *not* geometric scaling — wedded to Furnas's **Degree-of-Interest** law (CHI 1986) so prominence is a principled function of distance-from-focus, and Kinopio's **explicit connection cables** so a relation is *drawn*, never inferred from mere proximity. This is precisely Softland's \"one world at every scale, identity/provenance/relations survive the zoom\" — but only if zoom re-derives representations from the event-log truth rather than scaling pixels.", "avoid": "**Desert fog** (Jul & Furnas, UIST 1998) and **Prezi nausea** are the two documented harms to design against from the start. Desert fog is *structural* — any large, sparse multiscale space produces blank, landmark-free scale bands by default (Bederson 2011: zoom only works when the data is *inherently* spatial). Softland's knowledge-landscape is exactly such a large sparse space; without Muse's anchoring + off-screen indicators and Landmarking-style persistent trails, the \"Google-Earth-for-understanding\" zoom will strand users in fog. And never combine rotation with large-amplitude zoom transitions (Cockburn et al. 2008; Potter) — that is the vestibular-conflict recipe Prezi proved harmful.", "open": "No one — not the 1990s lab, not the current SDK winners — has answered the **affordance/discoverability problem**: how does a user *know* what is semantically zoomable, and what they'll find before they travel there? (Surfaced again in the 2026 Hacker News thread: \"there is no signifier, I am frequently disappointed when I click.\") For Softland this is the hardest unsolved problem, because it asks the system to advertise the *epistemic* contents of a region (claim vs. evidence vs. guess; commits vs. tickets vs. discourse) *at the scale you are currently at* — i.e., to make calibrated structure visible before you zoom, which is desert-fog and lawful-compression as a single combined constraint that the entire literature leaves open."}, {"num": 3, "title": "3. Sensemaking & Information Foraging", "family": "sense", "scent": "The sensemaking dual-loop + 'information scent'; Klein's rival frame model; and the empirical sting — absorbing the effortful loop deskills the user.", "body": "### The ecological transplant\n\nThe story of this thread begins in behavioral ecology, not in computing. In 1986 David W. Stephens and John R. Krebs published *Foraging Theory* (Princeton University Press), a book-length synthesis of how animals maximize energetic return while feeding. It formalized two models that would later be lifted wholesale into the study of human information work. The **patch model** asks: given that food is clumped into discrete patches, when should a forager abandon a depleting patch for a richer one elsewhere? Its answer is Eric Charnov's **marginal value theorem** (1976) — leave when the local return rate falls to the average rate available across the whole environment, with the crucial corollary that the costlier the travel to the next patch, the longer you should overstay the current one. The **diet model** asks which prey to pursue on encounter, given each prey's energetic value against its handling cost. Both rest on a single \"as-if\" assumption: animals behave as though maximizing gain per unit time. Even in biology the fit was only qualitatively good — foragers reliably *overstay* patches past the theoretically optimal leave-point, an empirical deviation that would echo, uncorrected, through the human version of the theory.\n\nThe transplant happened at Xerox PARC across a single decade. The word \"sensemaking\" entered HCI as a technical term at the joint INTERACT '93 / CHI '93 conference in Amsterdam in April 1993, in \"The Cost Structure of Sensemaking\" by Daniel M. Russell, Mark J. Stefik, Peter Pirolli, and Stuart K. Card (pp. 269–276). Stefik and Russell had each independently noticed that digital tools seemed to accelerate the group work of understanding; Pirolli and Card brought the mathematical modeling. Their definition is worth quoting because every later quarrel turns on it: sensemaking is \"the process of searching for a representation and encoding data in that representation to answer task-specific questions.\" The word *searching* does the work — this is active, cost-incurring labor, not passive reception. The paper's empirical finding, which became the founding premise of the entire PARC program, was that **extracting data is the most costly step** — consuming more than three-quarters of analyst time in their case studies. The implication was a design heuristic with teeth: reduce extraction cost and analysis improves. The framing is unambiguously cognitivist — sensemaking is information processing, costs are measured in time and effort, and the goal is to optimize a pipeline's throughput.\n\nInformation foraging theory proper arrived two years later. \"Information Foraging in Information Access Environments\" (CHI '95, pp. 51–58) is the genuine founding document, predating the famous *Psychological Review* paper by four years — a fact often lost because the later paper absorbed the citations. The vocabulary was assembled stepwise: \"Silk from a Sow's Ear\" (CHI '96) applied foraging ideas to web structure, and **information scent** was formally named in Pirolli's \"Computational Models of Information Scent-Following\" (CHI '97, pp. 3–10). The synthesis came as \"Information Foraging\" in *Psychological Review* 106(4): 643–675 (1999) — and the choice of venue was itself an argument. Publishing in a cognitive-psychology journal rather than a CS proceedings asserted that this was a theoretical claim about minds, not a design tip. The transplant was near-surgical: food patches became information patches (a site section, a corpus), prey diet became information diet (which items to pursue or skip), and food odor became **information scent** — \"the imperfect perception of the value, cost, or access path of information sources obtained from proximal cues, such as bibliographic citations, WWW links, or icons.\" The scent is the gradient the forager climbs without having yet read the destination. The load-bearing hypothesis is an *adaptation claim* grounded in John Anderson's (1990) rational analysis: humans in information environments behave approximately as agents maximizing information gain per unit time, the same pressure that shaped animal foraging. Rational analysis does not specify mechanism; it models the task environment, computes the optimal solution, and asks whether behavior approximates it. The computational embodiment was **SNIF-ACT**, an ACT-R model implementing scent as spreading activation (Pirolli & Fu, 2003), later validated against 74 subjects' link-selection behavior (Fu & Pirolli, 2007).\n\n### The intelligence-community turn\n\nSeptember 11, 2001 redirected the money. ARDA, the intelligence community's R&D arm, launched **Novel Intelligence from Massive Data (NIMD)**, issuing 17 contracts in September 2002 to thirteen institutions including PARC, Stanford, and Carnegie Mellon (SourceWatch; IT Law Wiki). PARC held a NIMD contract; I'll flag honestly that the *direct* causal line from NIMD money to the specific 2005 paper is inferential — the 2005 acknowledgments weren't accessible to verify — but the funding environment is documented and the timing is not coincidental.\n\nThe output was \"The Sensemaking Process and Leverage Points for Analyst Technology as Identified Through Cognitive Task Analysis\" (Pirolli & Card, *Proc. International Conference on Intelligence Analysis*, 2005). Built from think-aloud cognitive task analysis with working all-source analysts, it produced the **dual-loop diagram** that became the single most reproduced figure in the visual-analytics literature. An outer cycle runs between Reality and Policy; nested inside, a **foraging loop** searches and filters external sources, collects them into an unstructured **shoebox**, and extracts evidence into a structured **evidence file**; a **sensemaking loop** then schematizes that evidence into representations (timelines, narratives, models), generates and tests **hypotheses**, and produces a report. The genuinely new contribution over the 1993 paper was *bidirectionality* — schemas reveal gaps that send the analyst back to foraging; hypotheses demand data that restarts collection. Both bottom-up and top-down. The named leverage points — cheaper search, cheaper schema construction, hypothesis management — became the design agenda for a generation of tools.\n\n### The naturalistic counterattack\n\nThe deepest challenge came from a man working in a wholly different tradition. Gary Klein built **naturalistic decision making** from 1980s field studies of firefighters and military commanders deciding under time pressure — work that produced the **Recognition-Primed Decision** model, whose cardinal finding was that experts do not compare options at all; they recognize a situation as a familiar type and simulate forward from it. With Brian Moon and Robert Hoffman, Klein published a two-part critique in *IEEE Intelligent Systems* in 2006 (vol. 21, nos. 4 (pp. 70–73) and 5). Their definition deliberately rejects the PARC frame: sensemaking is \"a motivated, continuous effort to understand connections (which can be among people, places, and events) in order to anticipate their trajectories and act effectively.\" *Motivated* and *continuous* mark the break — sensemaking is purposive, forward-looking, anticipatory work, not neutral pipeline throughput. They debunked the post-9/11 \"connecting the dots\" metaphor: dots do not pre-exist; the failure before 9/11 was not a failure of connection but of *frame* — no analyst held a frame that made the scattered signals legible as a coordinated attack. (I'll note for honesty that the angle research framed Klein's papers as \"explicitly rejecting the NIMD agenda of automatic data fusion\"; the fact-check could not verify that specific targeting, so I state the documented version — they criticized the \"data fusion / automatic hypothesis inference\" *idea* as not necessarily helping — without attributing it to NIMD by name.)\n\nThe full theory followed as the **Data-Frame Theory** (Klein, Phillips, Rall & Peluso, *Proc. 6th Intl. Conf. on Naturalistic Decision Making*, 2007, pp. 113–155). A **frame** is \"an explanatory structure that defines entities by describing their relationship to other entities\"; sensemaking is \"the process of fitting data into a frame and fitting a frame around the data\" — the data elicit and construct the frame, while the frame defines, connects, and filters the data. The radical claim is that **data does not arrive pre-formed**: without a frame there is no information, only noise. The model names recursive cycles — an initial frame seeded by a few anchor points, an *elaboration* cycle seeking data to fill frame gaps, a *preservation* cycle that tracks anomalies without abandoning the frame, and a *reframing* cycle that rebuilds it once frame-breaking data accumulates. A counterintuitive finding: experts and novices run the same cycles; what distinguishes the expert is a richer **frame repertoire**. I want to flag that \"frames precede and *constitute* data, a direct inversion of the PARC pipeline\" is my reading and the angle's — the fact-check marks the strong \"inversion\" phrasing as interpretive, not verbatim Klein. The honest version: the two traditions disagree about whether data or frame is ontologically prior, and that disagreement has real design consequences.\n\n### The debates and the unit-of-analysis problem\n\nThe cognitivist and naturalistic camps are not two models of one thing; they disagree about the *unit of analysis*. PARC treats sensemaking as an individual cognitive process — decomposable, costable, accelerable by tools, governed by optimization. Klein treats it as situated, social, recognition-driven expertise that develops through effortful practice in regular environments. The practical consequence: PARC built tools that accelerate extraction and representation, measured by efficiency; NDM built training programs (Klein's ShadowBox) that develop recognition, measured by decision quality. Neither built for the *transition* between novice extraction-sensemaking and expert frame-sensemaking — the zone where most working analysts actually live.\n\nTwo further traditions complicate any tidy duel, and both are roads the HCI lineage largely declined. **Karl Weick**'s *Sensemaking in Organizations* (Sage, 1995) frames sensemaking as retrospective, social, and concerned with *plausibility, not accuracy* — meaning enacted collectively rather than extracted individually. **Brenda Dervin**'s Sense-Making Methodology (from a 1983 conference paper) treats it as an individual bridging cognitive \"gaps\" in an information-seeking journey. The 2025 *JASIST* meta-synthesis by Urquhart, Cheuk, Lam & Snowden (\"Sense-making, sensemaking and sense making,\" 76(1): 3–97) confirms the field never converged: qualitative information-science studies default to Dervin, organizational studies to Weick, and no \"overarching umbrella\" fits Weick, Dervin, Klein, and Pirolli together. The 2011 *Human-Computer Interaction* special issue (26(1–2), introduced by Pirolli & Russell) tried to bridge the camps and instead documented that they hold incompatible definitions of what sensemaking even *is*.\n\n### What failed, and why — the most important part\n\n**The Analysis of Competing Hypotheses (ACH)** is the cleanest documented failure, because it was actually tested. Richards Heuer's CIA-bred technique (*Psychology of Intelligence Analysis*, 1999) prescribes a matrix — hypotheses across columns, evidence down rows, each cell marked consistent or inconsistent — then eliminates the hypotheses with the most inconsistencies, the explicit aim being to defeat the confirmation bias blamed for the Iraq WMD failure. ACH was computerized via a federal grant to PARC in 2005, tying the cognitivist sensemaking program directly to the technique, and both the US government and the UK MoD promoted it. Then Dhami, Belton & Mandel ran a randomized controlled study of 50 trained intelligence analysts (*Applied Cognitive Psychology*, 33(6): 1080–1090, 2019): ACH-trained analysts did not follow all the prescribed steps, the evidence that it reduced confirmation bias was *mixed*, and ACH \"may increase judgement inconsistency and error.\" A structured technique, built on the cognitive-engineering tradition, funded by IC programs, institutionally mandated — and it raised error. The reason vindicates Klein: ACH assumes the analyst can *enumerate* the hypotheses up front, but confirmation bias operates precisely by preventing alternative hypotheses from being conceived at all. ACH attacked evidence evaluation; the real failure was frame generation.\n\n**Automatic abductive inference and data fusion** — the NIMD-era dream of systems that generate hypotheses from data — produced limited returns, and Klein's critique names the mechanism: an auto-generated hypothesis has no frame behind it, so it cannot direct attention the way an analyst's own frame does. I'll be honest that the strong claim \"analysts rejected these systems in evaluations\" is asserted-by-implication in the research, not independently verified here. What *is* documented: the operational IC kept using i2 Analyst's Notebook, a link-charting tool with no formal cognitive theory at all, while the PARC prototypes, Jigsaw, and the AQUAINT NLP systems stayed research artifacts. The gap between what sensemaking research prescribed and what practitioners adopted never closed.\n\n**The sensemaking loop was described but never computationally closed.** This is the structural failure that recurs for twenty years. Turkel & Hitchcock's 2025 digital-history adaptation (in *Historiografías* / SciELO, applying the model to the Old Bailey Online corpus) found that computational tools automate the *foraging* loop competently but the *sensemaking* loop — schema-building, hypothesis refinement — \"remains firmly in the domain of traditional, non-digital scholarship.\" They also note, pointedly, that the 2005 paper gave \"no further description of the methodology used,\" and \"Cognitive Task Analysis does not refer to a single specific technique\" — a methodological-transparency weakness in the field's most-cited model. The asymmetry Pirolli & Card created in 2005 — rich support for foraging, none for the inner loop — is structurally unresolved.\n\n**Optimal foraging was always more metaphor than measurement.** Biologists had already filed \"Eight Reasons Why Optimal Foraging Theory Is a Complete Waste of Time\" (Pierce & Ollason, 1987), arguing OFT is unfalsifiable because one can always add a constraint to rescue a failed prediction. The same non-falsifiability infects rational analysis: when human behavior deviates from optimal, add a parameter (search cost, uncertainty discount) and restore the fit. And the empirical deviation is real — humans, like animals, overstay patches and satisfice rather than leave at the predicted scent threshold; screen-reader users, lacking visual scent cues, deliberately clicked *low*-scent links, a direct falsification of universal scent-following (Fu & Pirolli, 2007).\n\n**A road not taken: semantic interaction.** Endert and colleagues' Forcespire (~2012–2018) let analyst gestures on a visualization — dragging related documents together — directly update the underlying statistical model, an elegant operationalization of the missing feedback from sensemaking back into foraging. It never scaled past research artifacts: it requires co-located statistical models and visualization backends, while real knowledge work is document-centric text-in/text-out. **A second road not taken: neurocognitive models.** IARPA's ICArUS program (2010–2014) bet that models constrained to brain-plausible architectures would better predict sensemaking failures (confirmation bias, anchoring); the models did predict four biases, but the program ended in 2014 with no visible successor — brain-plausibility added complexity without analytic leverage.\n\n### Cross-disciplinary borrowings and links to other threads\n\nThis thread is itself a borrowing — behavioral ecology into cognitive psychology — and its central object, the frame, is the same construct that appears across this report under other names: Minsky's frames and schema theory feed Klein directly, and the \"frame precedes data\" claim is a cousin of the constructivist position that representation determines what counts as signal. The shoebox→evidence-file→schema pipeline is structurally the **discourse-graph maturation** that appears elsewhere here (raw material → typed evidence → claims), and the unresolved question of how to *close the loop* back from interpretation into search is the same back-pressure problem that event-sourcing and provenance threads address from the data side. The cognitivist/naturalistic split also rhymes with the broader report tension between automation-that-summarizes and tools-that-preserve-the-user's-own-construction.\n\n### The 2024–2026 frontier\n\nPirolli himself moved to IHMC in 2017 and has not, as far as the indexed record shows, published a major 2024–2026 revision of the core models — the framework is now extended by others. The live frontier is **IFT meeting LLMs**, and it is breaking along three fault lines. Ragavan & Alipour's \"Revisiting Human Information Foraging: Adaptations for LLM-based Chatbots\" (arXiv:2406.04452, June 2024) — a thought-experiment, not yet empirical — argues the patch model simply does not transfer: a chat is \"one long patch that evolves with each interaction,\" information is created on the fly and ephemeral rather than permanent, and the user \"cannot see what else might be available,\" which structurally removes the opportunity-cost comparison the marginal value theorem requires. Qian & Liu's \"Scent of Knowledge / InForage\" (arXiv:2505.09316, NeurIPS 2025 Spotlight) goes the other way, *operationalizing* IFT as a reinforcement-learning reward — rewarding intermediate retrieval quality so an agent forages iteratively rather than retrieving once; whether its \"scent-as-reward-signal\" captures Pirolli's prospective-value sense or is merely a metaphor is unresolved in the paper. Gu, Palani & Setlur's \"I Need to Find That One Chart\" (CHI 2026, arXiv:2603.00485) gives the sharpest empirical statement of the interface failure: chat \"transcripts are misaligned with the iterative, nonlinear nature of real-world analyses,\" and their ten data workers used visual recall, sequential navigation, and abstractive summarization — none of which a linear transcript supports. That is the 1993 cost-structure insight, restated: representational mismatch manufactures cognitive work.\n\nThe naturalistic critique has migrated intact into the AI debate. Jain's \"Collaborative Causal Sensemaking\" (arXiv:2512.07801, Dec 2025) diagnoses why human-AI teams fail to beat the best individual: sensemaking — co-constructing causal explanations, surfacing uncertainty, adapting goals — \"is the key capability that current training pipelines do not explicitly develop,\" which is Klein's frame critique in LLM clothing. Tools cluster by which loop they serve: **Elicit** (200M-paper corpus, extraction matrices) and **NotebookLM** (closed-corpus summarization, no discovery) each cover one loop and not the other; **Synergi** (Kang et al., UIST '23), **DiscipLink** (Zheng et al., UIST '24, supplying interdisciplinary scent the user lacks), **ScholarMate** (CHIWORK '25, making AI suggestions visible and reversible against automation bias), and **InterDeepResearch** (arXiv:2603.12608, March 2026, attacking process-observability and mid-search steerability) are the more complete attempts.\n\nThe genuinely new pressure comes from a direction neither founding tradition anticipated: **deskilling**. Liu et al.'s \"AI Assistance Reduces Persistence and Hurts Independent Performance\" (arXiv:2604.04721, RCT, N=1,222) found AI help improved immediate performance but degraded later *unassisted* performance and reduced willingness to persist — after roughly ten minutes of use. RAND's \"Improving Sense-Making with Artificial Intelligence\" (RRA3152-1, March 2025) explicitly named analyst skill *atrophy* as a strategic risk and urged a mitigation plan. The CHI 2025 \"Tools for Thought\" workshop synthesis (arXiv:2508.21036) named \"mechanized convergence\" — group outputs narrowing toward fewer ideas when AI supplies the initial framing. The cost structure of sensemaking has indeed been transformed, but not as the marginal value theorem predicted: the new cost is not representational effort but *deliberate-practice deprivation*. When AI absorbs the effortful part of the loop, it absorbs the mechanism by which expertise is built — exactly the Klein-tradition warning, now with a randomized controlled trial behind it.", "steal": "The 2005 dual-loop is the right skeleton for the \"how did we get here\" braid — shoebox (raw commits/tickets/chat) → evidence file (typed discourse nodes) → schema/hypothesis (the causal narrative) — *but* steal the bidirectionality, not just the pipeline: the schema must send the user back to forage. Steal \"information scent\" literally as the design contract for navigation cues across the semantic-zoom levels: every link/glyph at every zoom must carry an honest proximal estimate of the value behind it (Pirolli & Card, *Psychological Review*, 1999), and steal Klein's frame repertoire as the unit a trail should make transferable — what made a reasoning trail useful is the *frame* it deployed, not the dots it connected (Klein et al., 2007).", "avoid": "Do not auto-fuse, auto-cluster, or auto-summarize the braid *before* the user holds a frame, and do not build an ACH-style \"enumerate all hypotheses then score evidence\" affordance as the primary sensemaking surface — Dhami, Belton & Mandel's RCT of 50 analysts found ACH \"may increase judgement inconsistency and error\" precisely because the real failure is frame *generation*, not evidence scoring (Dhami et al., *Applied Cognitive Psychology*, 33(6), 2019). The deeper avoidance: Liu et al.'s N=1,222 RCT shows that absorbing the effortful part of the loop deskills the user (arXiv:2604.04721) — Softland's \"rediscovery over consumption\" value is, here, an empirically-backed design constraint, not a preference.", "open": "How do you computationally *close the sensemaking loop* — feed the user's evolving frame back into what gets foraged next — without the closure becoming the automation that deskills? Twenty years of tools (Turkel & Hitchcock, 2025) automated foraging and left the inner loop to humans; semantic-interaction systems that tried to close it never scaled. Softland's event-log-as-truth substrate is a plausible new place to attempt the closure (the user's arrangement and attention acts become foraging signal), but whether \"attention-as-frame-signal\" is real scent or just instrumented metaphor — the same unresolved doubt that hangs over InForage's reward — is the hard problem this thread hands Softland unanswered."}, {"num": 4, "title": "4. Explorable Explanations & Reactive Documents", "family": "media", "scent": "Explorable explanations / reactive documents genuinely work — and die of 100-hour authoring cost (Distill's hiatus). Generation must collapse that cost.", "body": "**Roots.** The deep root is Ivan Sutherland's **Sketchpad** (1963): a drawing constrained by relationships you declare, so the drawing *is* a live model — the ancestor of \"manipulate the artifact = define the program.\" Seymour Papert's **constructionism** (LOGO; *Mindstorms*, 1980) and Alan Kay's **Dynabook** carried the thesis that you understand by *building and manipulating*, not reading. The modern crystallization is **Bret Victor**: \"Up and Down the Ladder of Abstraction\" (2011 — slide a parameter, see the whole behavior-space), the **\"Explorable Explanations\"** essay (2011, which brought the term into common use — it appears in passing in Brusilovsky 1994 — aiming to \"change people's relationship with text\" toward *active reading*), \"Inventing on Principle\" (2012), \"Learnable Programming\" (2012). His **Tangle.js** created **reactive documents** — prose with spreadsheet-like models the reader can perturb to see consequences. **Nicky Case** took the form to the public: \"Parable of the Polygons\" (with Vi Hart, 2014), LOOPY, \"The Evolution of Trust.\" Victor now runs **Dynamicland** (Oakland), \"a humane real-world computational medium for deep understanding.\" (Sutherland/Papert/Kay roots are canonical/established knowledge; the Victor–Case material is fetched.)\n\n**Debate / what failed and why.** The form is beloved and *does not scale*, for one brutal reason — **authoring cost**. Each explorable is bespoke: \"gathering data, cleaning it, building models, writing narrative, and building custom UIs and visualizations… no integrated solutions.\" Victor himself names it: \"Why isn't every paragraph in the New York Times written like this? One reason is that the resources for creating this material don't exist.\" The movement's flagship, **Distill.pub** (interactive ML journal, 2016–), announced an indefinite **hiatus in July 2021**: volunteer **burnout**, the **structural friction** of running a journal, doubt that peer review \"added enough value to justify the additional time cost to authors,\" and the raw fact that a Distill article \"often takes 100+ hours\" and needs a *team* (viz expert + web dev + subject specialist). Their own leaning was toward **self-publication (arXiv)** over the curated journal — a striking admission from the showcase of the form. The debate, then: explorables *prove* understanding-by-manipulation works, but the **production model has never found a sustainable form** — insight outpaces tooling and economics (the same wall as thread 1's Matuschak/Nielsen \"public goods\" diagnosis).\n\n**Cross-thread links.** \"Manipulate = program\" (Sutherland, Tangle) is thread 5's end-user-programming dream and the Apparatus/Schachman supplementary node (\"using is authoring\"). Dynamicland is the parent of the Folk Computer/Rizwan node. The economic diagnosis (public good, no moat, expensive) is *identical* to thread 1's — the same wall. The \"active reading / do the work\" ethic is Softland's \"rediscover, don't consume.\"\n\n**Frontier (2024–2026).** Research is squarely aimed at **collapsing authoring cost**: model-driven authoring, LLM-assisted explorable generation, and AR approaches (\"Augmented Math: Authoring AR-Based Explorable Explanations by Augmenting Static Math Textbooks,\" UIST 2023). Observable (Mike Bostock, D3 lineage) remains the closest shipping reactive-notebook substrate. The open question is explicitly whether **AI can collapse the 100-hour authoring cost** — generate the manipulable model from prose/data so explorables become cheap.", "steal": "the **reactive document / active-reading** model is exactly \"the artifact pane is a REPL, not a display\" and \"papers as logs you rebuild.\" The preview must be *perturbable*, not rendered.", "avoid": "Distill's documented death. Do NOT make each inhabitable artifact a bespoke 100-hour hand-build needing a viz-expert + web-dev + subject-specialist; it dies the same way. The authoring path must be cheap — this is exactly where your **JIT / LLM-generation** thesis earns its keep (generation *as* the authoring-cost collapse).", "open": "can LLM/JIT generation produce *correct, manipulable* models cheaply (the frontier bet), or does cheap generation reintroduce the calibration problem (thread 8 — the map lies)? Cheap explorables that are subtly wrong are worse than none."}, {"num": 5, "title": "5. Malleable / End-User / Local-First Software", "family": "media", "scent": "HyperCard → spreadsheet → local-first. The 'abstraction barrier' is why end-user programming never spread; the CRDT log = deterministic projection = your ontology, proven elsewhere.", "body": "### The founding vision: computation as personal clay\n\nThe deepest root of this thread is a refusal to accept the boundary between using software and making it. In 1977 Alan Kay and Adele Goldberg, writing at Xerox PARC, described in \"Personal Dynamic Media\" not a better office machine but \"a personal dynamic medium the size of a notebook... that could be owned by everyone and could have the power to handle virtually all of its owner's information-related needs.\" The decisive move was that programmability was not optional: for the computer to be a *personal* medium, its owner had to be able to reshape it. Smalltalk—the \"interim Dynabook\" the Learning Research Group built—made this a philosophical commitment rather than an implementation detail. Everything was an object; every object was inspectable and modifiable; there was no conceptual wall between use and modification. Kay's \"clay\" metaphor (later dated to the 1980s and central to the 2025 Ink & Switch essay) names the ambition exactly: a malleable material the user reshapes at will.\n\nTwo parallel currents fed this. Ted Nelson, who coined \"hypertext\" and \"hypermedia\" at a 1965 ACM conference, founded Project Xanadu (begun 1960) on transclusion—\"the same content knowably in more than one place\"—with bidirectional, non-breaking, attributed links. Xanadu is best read as a specification of what the web explicitly did *not* do: it never shipped in its original form for over fifty years, finally releasing only a limited demo in 2014 (Wikipedia, \"Project Xanadu\"). Seymour Papert's Logo and his constructionist learning theory (1970s–80s) supplied the pedagogical principle later formalized as \"low floor, high ceiling\": a child draws a square, then progressively complex geometry, with no point at which the tool says *this is where users stop and programmers begin*. Kay met Papert in 1968, watched children doing mathematics through Logo, and sketched the Dynabook on the flight home—a direct genealogical link.\n\n### VisiCalc and the empirical refutation—with an asterisk\n\nThe most successful end-user programming system ever built was not a programming environment in the conventional sense. Dan Bricklin conceived VisiCalc (\"visible calculator\") in spring 1978 watching a Harvard Business School professor erase and redo a blackboard of financial calculations after one assumption changed—the brittleness of computation on paper. With Bob Frankston he compressed a working spreadsheet into the Apple II's 20 kilobytes and released it on October 17, 1979 at roughly $99 (Wikipedia, \"VisiCalc\"; the \"under $100\" framing is technically right but usually rounded to $100). It sold over 700,000 copies in six years and is the empirical refutation of the claim that end-user programming cannot reach mass adoption—*but* with a critical asterisk: it succeeded because it was domain-specific, not general. (The common shorthand that VisiCalc \"prompted IBM to build the PC\" is contested; it was one factor among several, per the fact-check.)\n\nBonnie Nardi's *A Small Matter of Programming* (MIT Press, 1993) is the rigorous theoretical account of *why*. Using anthropological observation of spreadsheet and CAD users, she argued the core thesis the book is reliably documented for: the problem with programming is not programming but the *languages* people are asked to program in—general languages ignore domain knowledge, while spreadsheets supply \"task-specific\" operations matching users' existing cognitive vocabulary. She also named the social structure that makes end-user programming work: a four-role ecosystem of systems programmers, translators, \"local developers\" (power users with deep domain expertise and light programming skill), and end users proper. The \"local developer\"/\"gardener\"—the colleague who tinkers, builds small tools, and bridges the gap no tool can fully close—is the linchpin, and it recurs as the structural pattern through this entire thread. (The widely-cited \"10–20% of any group\" figure appears in secondary summaries but I could not verify it against the primary text; treat it as folklore, not data.)\n\n### HyperCard: the high-water mark and its institutional drowning\n\nBill Atkinson began HyperCard (working name \"WildCard\") in March 1985; Dan Winkler joined in 1986 to design HyperTalk, a scripting language deliberately written to read like plain English. Atkinson demonstrated it at MacWorld Boston on August 11, 1987, having extracted a commitment from CEO John Sculley that it would bundle free with every *new* Mac (existing owners paid $49.95—the unqualified \"free with every Mac\" elides this, per the fact-check). It embodied the \"gentle slope\" before anyone named it: five user levels—Browsing, Typing, Painting, Authoring, Scripting—each granting more power for a modest increase in skill. Millions built functioning stacks; Myst, the best-selling PC game from 1993–2001, was built in HyperCard (Wikipedia, \"Myst\"). The pointing-finger hyperlink cursor originated in HyperCard stacks; Robert Cailliau (who assisted Berners-Lee) and Brendan Eich (HyperTalk influencing JavaScript) both drew on it.\n\nHyperCard's death is the central parable of this thread, and it was institutional more than technical. **First**, the Claris mistake (c. 1990): Apple spun its software into the wholly-owned Claris subsidiary, and many HyperCard engineers chose to stay at Apple rather than move, splitting the team at a critical moment (Wikipedia, \"HyperCard\"). Claris, needing revenue, shipped crippled versions with authoring disabled—unlockable via a \"magic\" easter egg—then sold the full authoring product separately, destroying the free-distribution model that made it ubiquitous. **Second**, no business model: because value creation happened entirely on the user side, the things users built generated no revenue to fund development. This is the canonical failure mode of end-user infrastructure—success measured in what users make, monetized by no one. **Third**, the networking gap. HyperCard stacks were local artifacts. In a 2002 interview Atkinson said: \"If I'd grown up in a network-centric culture, like Sun, HyperCard might have been the first Web browser.\" (Calling this his \"biggest professional regret\" overstates it—the corroborated sources use \"missed the mark\" and \"blind spot,\" per the fact-check.) The final update was 1998; it was withdrawn from sale in March 2004. Tim Berners-Lee's web (1990) solved the one thing HyperCard lacked—distribution across machine boundaries—while discarding the one thing HyperCard had: a creation environment. That gap between distribution-without-creation and creation-without-distribution is the unresolved center of the field for thirty-five years. (Atkinson died of pancreatic cancer on June 5, 2025, age 74.)\n\n### Objects all the way down: Smalltalk, Self, Naked Objects—and why they couldn't commercialize\n\nRunning parallel was a bet that malleability comes from *reducing the number of conceptual layers* between users and objects. Self (David Ungar and Randall Smith, 1986; \"Self: The Power of Simplicity,\" OOPSLA 1987) eliminated classes entirely—everything a prototype, any object clonable and modifiable. Morphic (Randy Smith and John Maloney, c. 1993) made every visual element a directly inspectable \"morph,\" with composing and running not separate modes. Richard Pawson's *Naked Objects* (2002) carried the logic into enterprise software—expose domain objects directly, auto-generate the UI, eliminate the presentation layer—but found essentially one significant production deployment (a Dublin welfare system) and never crossed over.\n\nThe commercialization failure is documented sharply by Allen Wirfs-Brock's \"The Rise and Fall of Commercial Smalltalk\" (2012). Enterprise Smalltalk vendors (ParcPlace, Digitalk, Cincom) licensed at $2,000+ per seat and built excellent tools for replacing mainframe green-screens with GUIs—then were \"completely unprepared\" when the web browser became the platform in 1996. Platform fragmentation compounded it: porting between VisualWorks, VisualAge, and Visual Smalltalk required major rewrites. Kay's own verdict at OOPSLA 1997 (\"The Computer Revolution Has Not Happened Yet\") was that \"when Smalltalk went commercial—ceased [its evolution].\" The recurring law: *every time end-user infrastructure reached commercial scale, commercial pressure narrowed it rather than extended it.*\n\n### Roads not taken, and exactly why they failed\n\nThis is the load-bearing part. The failures are specific and they rhyme.\n\n**Lotus Improv (1991)** is the most interesting road not taken in spreadsheet history. Released first for NeXTSTEP, it separated data, formulas, and views into distinct layers; formulas referenced named categories rather than cell addresses, so data could be pivoted without rewriting formulas—modern pivot tables descend from it (Instadeq, 2021). It earned ecstatic reviews and sold NeXT machines. It failed because it was *too rigorous for its market*: users had to unlearn the organic, semi-structured, inconsistent way real spreadsheets get used—and that very \"sloppiness\" was the feature, not the bug. Lotus's own sales force defaulted to selling 1-2-3; Excel's Office bundling undercut it; it lacked a macro language and undo at launch. Development was suspended 1994; the product ended April 1996. Joel Spolsky (2005) said Improv lost \"the essence of a spreadsheet.\" The unresolved debate it crystallized—*organic vs. structured*—runs straight to the present: every attempt to impose more structure has paid an adoption cost.\n\n**Lotus's litigation** is the second failure: having won, the incumbent became protectionist, filing \"look and feel\" suits (Paperback's VP Planner, Borland's Quattro) from 1987. The doctrine that interface metaphors could be *owned* froze paradigm innovation and created legal risk for anyone trying to improve it—a reminder that the threats to malleability are legal-institutional, not only technical (the chain runs to Apple's App Store today).\n\n**Ink & Switch's own internal prototypes** document the failures most honestly. **PushPin** (media canvas) hardcoded component dispatch for predetermined contexts, so components couldn't share state (e.g., hover) or reach into one another—UI composition is genuinely hard. **Capstone** found that \"Edit Card Source\" felt \"uninspiring\"—\"the jump from cards-on-a-canvas... to a cryptic code editor with Javascript and React code was incongruous\"—and that invisible computation (\"Hooks,\" like database triggers) is \"typically reserved for professional database engineers.\" Data-pipeline visualizations created the clutter problem the team named as endemic to \"many/most visual programming systems.\" **Project Cambria** (2020–21), attempting interoperability between tools with incompatible schemas via bidirectional \"lenses,\" revealed that bidirectionality has *fundamental* limits: the one-assignee-to-many-assignees conversion had no ideal solution (six approaches, distinct trade-offs); a lens cannot supply data not present in the source; old software can silently reintroduce removed fields and lose data. Its Automerge integration proved \"too complex\" (Malleable Software, 2025). Cambria's deepest finding is conceptual: interoperability is \"a human-centered design question about how far two pieces of software can diverge before it becomes impossible to usefully collaborate\"—*not* a technical question with a clean technical answer.\n\n**Wildcard** (Geoffrey Litt and Daniel Jackson, Convivial Computing Salon 2020) is the most precise statement of the *bottleneck* failure. It gave users a synchronized spreadsheet view to customize web apps without writing scraper code—a direct realization of Nardi's local-developer model. But it required programmers to write per-site \"adapters\" mapping DOM to tables first; end users could only customize sites for which an adapter already existed, and adapters break when sites change. The path to customization ran *through the same programmer bottleneck it claimed to bypass*. The authors deferred the core problem (\"we plan to explore enabling end users to also create site adapters\") rather than solving it.\n\nThe web itself is the largest missed opportunity. Berners-Lee (1990) lowered distribution cost to near zero but locked out creation behind HTML, then JavaScript, then servers. \"View-source\" was the web's faint echo of HyperCard's authoring; wikis (partly HyperCard-inspired) gave communities creation power within a narrow textual medium. But the structural gap Atkinson named has never been closed at scale.\n\n### The research verdict on why it never spread\n\nAndrew Ko and colleagues' \"The State of the Art in End-User Software Engineering\" (*ACM Computing Surveys*, 2011) is the systematic post-mortem. Three findings matter for Softland. **The numbers were enormous and invisible**: Scaffidi, Shaw, and Myers (2005) projected ~90 million U.S. end-user programmers by 2012 against ~3 million professional developers—most programming was already end-user programming. **The abstraction barrier is rational, not cognitive**: a large class of users will not voluntarily create abstractions (functions, variables, reusable components) on a computer, because abstraction demands speculative effort now for uncertain future benefit—and adoption cliffs appear precisely at the point a system demands it. Ko and Myers' earlier \"Six Learning Barriers in End-User Programming Systems\" (2004) decomposed this into design, selection, coordination, use, understanding, and information barriers that *stack*—a user blocked at the design barrier never reaches the scripting layer. **The field was fragmented**: spreadsheets, visual programming, programming-by-demonstration, and end-user debugging rarely built on each other, so knowledge did not accumulate.\n\n### Cross-disciplinary borrowings and links to other threads\n\nThis thread is unusually explicit about its philosophi
