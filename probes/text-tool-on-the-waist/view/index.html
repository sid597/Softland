<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Softland — a view on the executor</title>
<style>
  body { font: 13px/1.4 monospace; margin: 12px; display: grid; grid-template-columns: auto 1fr; gap: 16px; color: #222; background: #fafafa; }
  canvas { border: 1px solid #999; image-rendering: pixelated; background: #fff; display: block; }
  pre { white-space: pre-wrap; margin: 8px 0; }
  textarea { width: 100%; height: 360px; font: 12px/1.3 monospace; }
  #records span { cursor: pointer; margin-right: 10px; text-decoration: underline; }
  #hint { color: #666; }
</style>
</head>
<body>
  <div>
    <canvas id="painting" width="480" height="270"></canvas>
    <pre id="readout"></pre>
    <pre id="hint">type to add keystrokes to the cursor's run · move the pointer over the text · click a record to edit it in place</pre>
  </div>
  <div>
    <div id="records"></div>
    <textarea id="editor" spellcheck="false"></textarea>
    <div><button id="apply">apply</button> <span id="status"></span></div>
  </div>
  <script src="main.js"></script>
  <script>app.client.view.core.start_BANG_();</script>
</body>
</html>
