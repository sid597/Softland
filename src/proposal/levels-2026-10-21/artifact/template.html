<title>Softland Levels Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Softland's levels exploration of 21 October 2026: the notebook pages, the stack of eleven levels, breakouts A to M, the bridges, and the map of agreements and tensions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading spine (max 1160px) under a sticky rail of questions; each section opens with its question and one figure, and its details fold out in place. */
:root {
  --paper: #F3F4EF;      /* page ground: cool notebook paper */
  --sheet: #FBFBF8;      /* raised surfaces: cards, panels, figures */
  --ink: #141B2E;        /* ballpoint blue-black: text and strokes */
  --ink-2: #4A526B;      /* secondary text */
  --ink-3: #6E768D;      /* labels, sources */
  --rule: #D6D9E1;       /* hairlines */
  --wash: #E7E9EF;       /* quiet fills */
  --sid: #2A56C6;        /* Sid's own words (validated with --pasted) */
  --sid-wash: rgba(42, 86, 198, 0.11);
  --pasted: #C4501E;     /* session text Sid pasted */
  --pasted-wash: rgba(196, 80, 30, 0.10);
  --hl: #EFC92E;         /* highlighter: the waist */
  --hl-wash: rgba(239, 201, 46, 0.50);
  --agree: rgba(42, 86, 198, 0.08);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  --rail-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E131F; --sheet: #151C2C; --ink: #E6E9F1; --ink-2: #AEB5C9; --ink-3: #8A93AA;
    --rule: #2A3349; --wash: #1D2538; --sid: #6384EE; --sid-wash: rgba(99, 132, 238, 0.17);
    --pasted: #DB6A37; --pasted-wash: rgba(219, 106, 55, 0.16); --hl: #D7B23A; --hl-wash: rgba(215, 178, 58, 0.30);
    --agree: rgba(99, 132, 238, 0.13); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E131F; --sheet: #151C2C; --ink: #E6E9F1; --ink-2: #AEB5C9; --ink-3: #8A93AA;
  --rule: #2A3349; --wash: #1D2538; --sid: #6384EE; --sid-wash: rgba(99, 132, 238, 0.17);
  --pasted: #DB6A37; --pasted-wash: rgba(219, 106, 55, 0.16); --hl: #D7B23A; --hl-wash: rgba(215, 178, 58, 0.30);
  --agree: rgba(99, 132, 238, 0.13); color-scheme: dark;
}

html { scroll-padding-top: calc(var(--rail-h) + 16px + env(safe-area-inset-top, 0px)); scroll-behavior: smooth; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
* { box-sizing: border-box; }
p { margin: 0 0 10px; }
ul, ol { margin: 0 0 10px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sid); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--wash); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
svg text { font-family: var(--font-body); }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: 16px; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 60; background: var(--sheet); padding: 8px 12px; border: 1px solid var(--ink); }

/* The rail */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@supports (backdrop-filter: blur(8px)) { .rail { background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); } }
.rail-in { max-width: 1160px; margin: 0 auto; height: var(--rail-h); display: flex; align-items: center; gap: 14px; }
.rail-mark { font-family: var(--font-display); font-weight: 750; font-size: 18px; text-decoration: none; letter-spacing: -0.01em; white-space: nowrap; }
.rail nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.rail nav::-webkit-scrollbar { display: none; }
.rail nav a { padding: 6px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; white-space: nowrap; font-size: 14px; }
.rail nav a:hover { color: var(--ink); background: var(--wash); }
.rail nav a[aria-current="true"] { color: var(--ink); background: var(--wash); box-shadow: inset 0 -2px 0 var(--ink); }
.rail .btn { flex: none; }
@media (max-width: 720px) { .rail-mark { display: none; } .rail #mark-sid { display: none; } }

main, .foot { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mast, .sec { max-width: 1160px; margin: 0 auto; }
.sec { padding-block: 56px 28px; border-top: 1px solid var(--rule); }

/* Type */
h1 { font-family: var(--font-display); font-size: clamp(36px, 6vw, 64px); line-height: 1.02; letter-spacing: -0.025em; font-weight: 760; margin: 8px 0 16px; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: clamp(27px, 3.6vw, 38px); line-height: 1.1; letter-spacing: -0.015em; font-weight: 700; margin: 6px 0 10px; text-wrap: balance; }
h3, h4 { text-wrap: balance; }
.sub-h { font-family: var(--font-display); font-size: 21px; line-height: 1.25; font-weight: 650; margin: 38px 0 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); margin: 0; overflow-wrap: anywhere; }
.guide { color: var(--ink-2); font-style: italic; max-width: 70ch; }
.guide-inline { color: var(--ink-2); font-style: italic; font-size: 14px; }
.guide-flag { border-left: 2px solid var(--ink-3); padding-left: 10px; }
.ex { max-width: 74ch; }
.lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); margin-right: 6px; font-style: normal; font-weight: 400; }
.lbl-block { display: block; margin: 4px 0 2px; }
.src { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; font-style: normal; font-weight: 400; }
.path { font-family: var(--font-mono); font-size: 0.86em; color: var(--ink-2); }
.srcline { margin-top: 4px; }
.mini-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); margin: 14px 0 6px; }
.sec-head { margin-bottom: 18px; }
.tag-alt { display: inline-block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); border: 1px dashed var(--ink-3); border-radius: 999px; padding: 2px 8px; vertical-align: middle; font-weight: 400; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ink); background: var(--sheet); color: var(--ink); border-radius: 8px; padding: 7px 12px; font-size: 14px; cursor: pointer; line-height: 1.2; }
.btn:hover { background: var(--wash); }
.btn[aria-pressed="true"], .btn[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
.btn-small { padding: 5px 10px; font-size: 13px; }
.btn-ghost { border-color: var(--rule); }
.chip-go { font-family: var(--font-mono); font-size: 12px; font-weight: 600; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 1px 7px; cursor: pointer; line-height: 1.5; }
.chip-go:hover { border-color: var(--ink); }
.chip-t { border-style: dashed; }
.chip-w { font-family: var(--font-mono); font-size: 11px; border: 1px dotted var(--ink-3); border-radius: 6px; padding: 1px 6px; }
.seg { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; cursor: pointer; }
.seg:hover { border-color: var(--ink); }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg-l { font-family: var(--font-mono); font-size: 11px; opacity: 0.8; margin-left: 4px; }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px var(--hl); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* Badges and quotes */
.badge { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 3px 6px; font-size: 12px; line-height: 1.2; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); vertical-align: middle; max-width: 100%; font-style: normal; font-weight: 400; }
.b-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
.b-who { font-weight: 700; }
.b-what { color: var(--ink-2); }
.b-sid { border-color: var(--sid); }
.b-sid .b-dot { background: var(--sid); }
.b-sidq { border-color: var(--sid); border-style: dashed; }
.b-sidq .b-dot { background: transparent; border: 2px solid var(--sid); }
.b-older { border-color: var(--rule); }
.b-older .b-dot { background: transparent; border: 2px solid var(--sid); border-radius: 2px; }
.b-pasted { border-color: var(--pasted); }
.b-pasted .b-dot { background: var(--pasted); border-radius: 2px; }
.b-unknown { border-style: dotted; border-color: var(--ink-3); }
.b-unknown .b-dot { background: transparent; border: 2px dotted var(--ink-3); }
.ktag { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 7px; white-space: nowrap; font-style: normal; }
.k-outside { border-style: dashed; }
.k-derived { border-style: dotted; border-color: var(--ink-3); }
.k-reading { border-style: dashed; border-color: var(--ink-3); }
.quote { margin: 14px 0; padding: 10px 16px 12px; border-left: 3px solid var(--ink-3); background: var(--sheet); border-radius: 0 var(--r) var(--r) 0; max-width: 80ch; }
.q-sid { border-left-color: var(--sid); }
.q-pasted { border-left-color: var(--pasted); }
.q-unknown { border-left-style: dotted; }
.q-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 6px; }
.q-why { font-size: 12.5px; color: var(--ink-2); font-style: italic; }
.quote blockquote { margin: 0; font-size: 17px; line-height: 1.5; overflow-wrap: anywhere; }
.q-root blockquote { font-family: var(--font-display); font-size: 24px; line-height: 1.25; }
.q-method blockquote { font-size: 18px; }
body.mark-sid .q-sid, body.mark-sid .nb-text, body.mark-sid .pp-b-sid, body.mark-sid .pp-b-sidq { background: var(--sid-wash); box-shadow: 0 0 0 2px var(--sid); border-radius: 8px; }
body.mark-sid .q-sid blockquote, body.mark-sid .nb-t { font-weight: 700; }

/* Masthead */
.mast { padding-block: 40px 40px; }
.lede { font-size: 19px; line-height: 1.5; max-width: 62ch; }
.lede-strong { font-size: 16px; max-width: 70ch; color: var(--ink); }
.fmf { margin: 26px 0 8px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 12px 4px; }
.fmf-stage { width: 100%; }
.fmf-stage svg { display: block; width: 100%; height: auto; margin: 0 auto; }
.fmf-stage svg.fmf-v { max-width: 520px; }
.fmf-cap { border-top: 1px solid var(--rule); padding: 12px 4px 6px; min-height: 132px; }
.fmf-cap .quote { margin: 8px 0; }
.cap-t { font-family: var(--font-display); font-weight: 650; font-size: 17px; margin-bottom: 4px; }
.cap-l { font-family: var(--font-display); font-weight: 800; margin-right: 4px; }
.cap-m { font-size: 13.5px; color: var(--ink-2); }
.fmf-env { fill: var(--wash); }
.fmf-e { fill: none; stroke: var(--ink-3); stroke-opacity: 0.45; stroke-width: 1.2; transition: stroke-opacity 0.2s, stroke-width 0.2s; }
.fmf-e.dash { stroke-dasharray: 4 4; }
.fmf.has-sel .fmf-e { stroke-opacity: 0.1; }
.fmf.has-sel .fmf-e.hot { stroke: var(--ink); stroke-opacity: 0.95; stroke-width: 2.2; }
.fmf-n { cursor: pointer; transition: opacity 0.2s; }
.fmf-n rect, .fmf-n circle { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.4; }
.fmf-n .later { stroke-dasharray: 4 3; }
.fmf-n text { fill: var(--ink); font-size: 13px; }
.fmf-n .in { font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.fmf-n .lab { fill: var(--ink-2); font-size: 13.5px; paint-order: stroke; stroke: var(--wash); stroke-width: 5px; stroke-linejoin: round; }
.fmf-n .sub { fill: var(--ink-2); font-size: 11.5px; text-anchor: middle; }
.fmf-n.dim { opacity: 0.3; }
.fmf-n.sel rect, .fmf-n.sel circle { fill: var(--ink); }
.fmf-n.sel .in { fill: var(--paper); }
.fmf-n.sel .lab { fill: var(--ink); font-weight: 700; }
.fmf-n.near rect, .fmf-n.near circle { stroke-width: 2.4; }
.fmf-n:focus-visible { outline: none; }
.fmf-n:focus-visible rect, .fmf-n:focus-visible circle { stroke: var(--sid); stroke-width: 3; }
.fmf-stagel { fill: var(--ink-3); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.key { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 16px 32px; margin-top: 24px; padding: 16px 18px; border: 1px dashed var(--ink-3); border-radius: 12px; }
.key-h { font-family: var(--font-display); font-weight: 650; font-size: 16px; margin-bottom: 6px; }
.key-list { list-style: none; padding: 0; margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.key-note { font-size: 14px; color: var(--ink-2); max-width: 60ch; }

/* Start */
.nb-pair { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; margin: 10px 0 30px; }
.nb-photo { margin: 0; position: sticky; top: calc(var(--rail-h) + 16px + env(safe-area-inset-top, 0px)); }
.nb-photo figcaption { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.nb-zoom { display: block; position: relative; padding: 0; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: #FFFFFF; cursor: zoom-in; width: 100%; }
.nb-zoom img { display: block; width: 100%; height: auto; }
.nb-band { position: absolute; left: 0; right: 0; background: var(--hl-wash); mix-blend-mode: multiply; border-top: 2px solid var(--hl); border-bottom: 2px solid var(--hl); pointer-events: none; }
.nb-text { min-width: 0; padding: 4px; }
.nb-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 650; font-size: 18px; }
.nb-lines { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.nb-line { padding: 9px 12px; border-radius: 8px; border: 1px solid transparent; }
.nb-line:hover, .nb-line:focus, .nb-line.on { background: var(--sheet); border-color: var(--rule); outline: none; }
.nb-line:focus-visible { box-shadow: 0 0 0 2px var(--sid); }
.nb-t { font-size: 17px; line-height: 1.45; margin: 0; }
.nb-pair[data-page="1"] .nb-line:first-child .nb-t { font-weight: 700; }
.nb-sort { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
.nb-sort-h { margin: 0 0 2px; font-size: 12.5px; }
.nb-sort ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 1px; }
.sort-l { font-weight: 700; color: var(--ink); }
.sort-arrow { margin: 0 6px; color: var(--ink-3); }
.nb-note { font-size: 14px; color: var(--ink-2); margin: 6px 0 0; }
.two-q { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 24px; align-items: start; }
.fl { margin: 6px 0 14px; }
.fig-h { font-size: 14px; color: var(--ink-2); margin-bottom: 8px; }
.fl-steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.fl-step { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.fl-hot { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.fl-n { font-family: var(--font-mono); font-weight: 600; font-size: 13.5px; letter-spacing: 0.04em; margin: 0; }
.fl-n span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 12px; margin-right: 6px; }
.fl-q { font-size: 15.5px; margin: 2px 0 4px; }
.fl-need, .fl-new { font-size: 13px; color: var(--ink-2); margin: 0; }
.fl-new.is-new { color: var(--ink); }
.fl-new.is-new strong { background: var(--hl-wash); padding: 0 3px; border-radius: 3px; }
.fl-loop { font-style: italic; }
.fl-host { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--ink); border-radius: var(--r); background: var(--sheet); font-size: 15px; }
.fl-host .fl-new { display: inline; font-size: 15px; }
.fl-so { margin-top: 10px; }
details.more { margin: 12px 0 18px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); padding: 0 14px; }
details.more > summary { cursor: pointer; padding: 10px 0; font-weight: 700; }
details.more[open] > summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.seeds-wrap { margin-top: 10px; }
.seeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 10px 0 12px; }
.seed { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
.seed h4 { font-family: var(--font-display); font-size: 17px; margin: 0 0 4px; }
.seed .quote { margin: 8px 0; padding: 8px 12px; background: var(--paper); }
.seed .quote blockquote { font-size: 15.5px; }
.seed-to { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0; }

/* The box */
.shorts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.short { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; font-size: 15.5px; }
.short strong { display: block; font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 14px; margin: 10px 0 14px; }
.cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; margin: 10px 0 14px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; font-size: 15.5px; }
.card-n { font-family: var(--font-display); font-weight: 800; font-size: 22px; margin: 0 0 2px; color: var(--ink-3); }
.ex-list { padding-left: 20px; display: grid; gap: 4px; }
.later { border-top: 1px dashed var(--rule); margin-top: 8px; padding-top: 8px; font-size: 14.5px; }
.later-h { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin-bottom: 4px; }
.pasted-back { font-size: 14px; color: var(--ink-2); background: var(--pasted-wash); border-radius: 8px; padding: 8px 10px; }
.depot { margin: 26px 0; padding: 18px; border: 1px solid var(--ink); border-radius: 14px; background: var(--sheet); scroll-margin-top: calc(var(--rail-h) + 16px); }
.depot .sub-h { margin-top: 0; }
.depot-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.depot-side { border-top: 3px solid var(--ink); padding-top: 10px; font-size: 15.5px; }
.depot-alt { border-top-style: dashed; }
.side-h { font-family: var(--font-display); font-weight: 650; font-size: 17px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.side-sub { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 12px 0 4px; }
.depot-agree { border-top: 1px dashed var(--rule); margin-top: 14px; padding-top: 4px; font-size: 15.5px; }
.anatomy { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 24px; align-items: start; }
.anat-fig { margin: 0; color: var(--ink); }
.anat-fig svg { width: 100%; height: auto; display: block; }
.anat-fig figcaption { font-size: 13px; color: var(--ink-2); }
.an-slab { fill: var(--wash); stroke: var(--rule); }
.an-box { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.6; }
.an-secret { fill: var(--wash); stroke: var(--ink-3); stroke-dasharray: 4 3; }
.an-hatch { stroke: var(--ink-3); stroke-width: 1; opacity: 0.5; }
.an-line { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.an-knob { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.6; }
.an-t { fill: var(--ink); font-size: 15px; font-weight: 700; }

        el("rect", { x: cols.J, y: Y(j), width: W, height: Hh, rx: 6, "class": nw ? "ts-empty" : "ts-slot" + (chg[j] ? " ts-hot" : "") }, svg);
        txt(svg, cols.J + 8, Y(j) + 16, "#" + y.id, "ts-s"); txt(svg, cols.J + 8, Y(j) + 31, label(y), "ts-m");
        if (nw) txt(svg, cols.J + W - 6, Y(j) + 16, "added", "ts-s", "end");
        else if (chg[j]) txt(svg, cols.J + W - 6, Y(j) + 16, "changed", "ts-s", "end");
      });
      m.pairs.forEach(function (pr, u) {
        var x = I[pr[0]], uy = Y(u);
        el("rect", { x: cols.U, y: uy, width: W, height: Hh, rx: 6, "class": "ts-slot" }, svg);
        var key = mode === "num" ? "#" + x.id : mode === "name" ? "name " + x.k : "position " + (pr[0] + 1);
        txt(svg, cols.U + W / 2, uy + 24, key, "ts-t", "middle");
        el("path", { d: "M" + cols.U + " " + (uy + Hh / 2) + " C" + (cols.U - 12) + " " + (uy + Hh / 2) + " " + (cols.I + W + 12) + " " + (Y(pr[0]) + Hh / 2) + " " + (cols.I + W + 2) + " " + (Y(pr[0]) + Hh / 2), "class": "ts-a", "marker-end": mk }, svg);
        el("path", { d: "M" + (cols.U + W) + " " + (uy + Hh / 2) + " C" + (cols.U + W + 12) + " " + (uy + Hh / 2) + " " + (cols.J - 12) + " " + (Y(pr[1]) + Hh / 2) + " " + (cols.J - 2) + " " + (Y(pr[1]) + Hh / 2), "class": "ts-a", "marker-end": mk }, svg);
      });
      txt(svg, cols.U + W / 2, 214, mode === "num" ? "U is given" : "U is a guess", "ts-b", "middle");
      var items = [];
      m.pairs.forEach(function (pr) {
        var x = I[pr[0]], y = J[pr[1]];
        if (x.k !== y.k || x.a !== y.a) items.push('<li class="r-chg">changed: <code>' + esc(label(x)) + "</code> → <code>" + esc(label(y)) + "</code></li>");
      });
      m.removed.forEach(function (i) { items.push('<li class="r-gone">removed: <code>' + esc(label(I[i])) + "</code></li>"); });
      m.added.forEach(function (j) { items.push('<li class="r-new">added: <code>' + esc(label(J[j])) + "</code></li>"); });
      var same = m.pairs.length - Object.keys(chg).length;
      items.unshift("<li>kept as it was: " + same + "</li>");
      rep.innerHTML = items.join("");
      var n = changes(m, J), t = changes(truth, J);
      if (mode === "num") verdict.textContent = "✓ Exact. U is the set of ids present in both states.";
      else if (n === t && JSON.stringify(m.pairs) === JSON.stringify(truth.pairs)) verdict.textContent = "This guess happens to agree with the numbers here.";
      else verdict.textContent = "✗ A guess. It reports " + n + " change" + (n === 1 ? "" : "s") + "; by number there " + (t === 1 ? "is " : "are ") + t + ".";
      $$(".toy-q[data-show]", root).forEach(function (q) { q.classList.toggle("on", q.getAttribute("data-show") === mode); });
    }
    root.addEventListener("change", render);
    render();
  }

  /* ---------- Toy 3: keep everything, then choose ---------- */
  function toyMerge() {
    var root = $("#toy-merge"); if (!root) return;
    var tP = $("#t3-p"), res = $("#t3-res");
    var VIMB = [{ key: "C-s", cmd: "write", mode: "normal" }, { key: "w", cmd: "next word", mode: "normal" }];
    var VSCB = [{ key: "C-s", cmd: "save", when: "editor focused" }];
    function render() {
      var fill = radio(root, "t3-fill"), pol = radio(root, "t3-pol"), ord = radio(root, "t3-ord"), rec = radio(root, "t3-rec");
      $$(".t3-sub", root).forEach(function (f) { f.hidden = f.getAttribute("data-for") !== pol; });
      var rows = [], wi = 0, mi = 0;
      VIMB.forEach(function (b) { wi++; rows.push({ key: b.key, cmd: b.cmd, mode: b.mode, when: fill === "sigma" ? "when" + wi + "?" : "* default", from: "vim-like", unk: "when" }); });
      VSCB.forEach(function (b) { mi++; rows.push({ key: b.key, cmd: b.cmd, mode: fill === "sigma" ? "mode" + mi + "?" : "* default", when: b.when, from: "vscode-like", unk: "mode" }); });
      tP.innerHTML = "<thead><tr><th>key</th><th>cmd</th><th>mode</th><th>when</th><th>from</th></tr></thead><tbody>" + rows.map(function (r) {
        return "<tr><td><code>" + r.key + "</code></td><td>" + r.cmd + "</td><td" + (r.unk === "mode" ? ' class="unk"' : "") + ">" + r.mode + "</td><td" + (r.unk === "when" ? ' class="unk"' : "") + ">" + r.when + '</td><td class="from">' + r.from + "</td></tr>";
      }).join("") + "</tbody>";
      var vimCs = rows[0], vscCs = rows[2], out;
      if (pol === "order") {
        var win = ord === "vim" ? vimCs : vscCs;
        out = "<p>Two rows answer <code>C-s</code>. The builds-on order lists " + (ord === "vim" ? "vim-like" : "vscode-like") + " first, so its row wins.</p>" +
          '<p class="big">C-s ↦ ' + win.cmd + " (" + win.from + ")</p>";
      } else if (pol === "error") {
        out = '<p class="big">error: two parents both answer C-s</p><p>An ambiguity error, as Self reports one.</p>';
      } else {
        var keep = rec === "vim" ? vimCs : vscCs;
        out = "<p>The person merging resolved it once, and the resolution is recorded.</p>" +
          '<p class="big">C-s ↦ ' + keep.cmd + " (recorded: keep " + keep.from + "’s)</p>";
      }
      out += "<p>Either way, P still holds all " + rows.length + " rows. Only the choice on top changed.</p>";
      res.innerHTML = out;
      var on = [fill, pol];
      $$(".toy-q[data-show]", root).forEach(function (q) { q.classList.toggle("on", on.indexOf(q.getAttribute("data-show")) >= 0); });
    }
    root.addEventListener("change", render);
    render();
  }

  /* ---------- Toy 4: share or copy ---------- */
  function toyShare() {
    var root = $("#toy-share"); if (!root) return;
    var svg = $("#t4-svg"), out = $("#t4-out"), verdict = $("#t4-verdict");
    var st;
    function reset() { st = { shared: ["open file", "find"], me: ["open file", "find"], vs: ["open file", "find"], hideG: false, hideMe: false, n: 0, last: "" }; }
    reset();
    function views() {
      var mode = radio(root, "t4-mode");
      if (mode === "share") {
        var me = st.shared.filter(function (c) { return !((st.hideG || st.hideMe) && c === "find"); });
        var vs = st.shared.filter(function (c) { return !(st.hideG && c === "find"); });
        return { mode: mode, me: me, vs: vs };
      }
      return { mode: mode, me: st.me.slice(), vs: st.vs.slice() };
    }
    function act(a) {
      var mode = radio(root, "t4-mode"), ov = radio(root, "t4-ov");
      if (a === "reset") { reset(); render(); return; }
      if (a === "hide") {
        if (mode === "share") { if (ov === "global") st.hideG = true; else st.hideMe = true; }
        else st.me = st.me.filter(function (c) { return c !== "find"; });
        st.last = "hide";
      } else {
        st.n++;
        var c = "command " + st.n + (a === "edit-me" ? " (from my editor)" : " (from vscode-like)");
        if (mode === "share") st.shared.push(c);
        else (a === "edit-me" ? st.me : st.vs).push(c);
        st.last = a;
      }
      render();
    }
    function listIn(g, x, y, items) { items.slice(0, 7).forEach(function (c, i) { txt(g, x, y + i * 17, "· " + c.replace(" (from my editor)", " ←me").replace(" (from vscode-like)", " ←vs"), "ts-t"); }); }
    function draw(v) {
      svg.innerHTML = ""; var mk = arrowDefs(svg, "t4-arr");
      el("rect", { x: 8, y: 14, width: 124, height: 222, rx: 8, "class": "ts-slab" }, svg); txt(svg, 18, 34, "my editor", "ts-b");
      el("rect", { x: 288, y: 14, width: 124, height: 222, rx: 8, "class": "ts-slab" }, svg); txt(svg, 298, 34, "vscode-like", "ts-b");
      listIn(svg, 16, 58, v.me); listIn(svg, 296, 58, v.vs);
      if (v.mode === "share") {
        el("rect", { x: 152, y: 84, width: 116, height: 84, rx: 8, "class": "ts-slot ts-hot" }, svg);
        txt(svg, 210, 104, "one state", "ts-b", "middle"); txt(svg, 210, 122, st.shared.length + " commands", "ts-s", "middle");
        txt(svg, 210, 140, "p → p × p", "ts-m", "middle");
        el("path", { d: "M152 110 H136", "class": "ts-a", "marker-end": mk }, svg); el("path", { d: "M268 110 H284", "class": "ts-a", "marker-end": mk }, svg);
        el("path", { d: "M136 146 H150", "class": "ts-d", "marker-end": mk }, svg); el("path", { d: "M284 146 H270", "class": "ts-d", "marker-end": mk }, svg);
        txt(svg, 210, 190, "shows: copied to both", "ts-s", "middle"); txt(svg, 210, 206, "accepts: merged into one", "ts-s", "middle");
        if (st.hideMe) txt(svg, 16, 226, "override tagged here", "ts-s");
        if (st.hideG) txt(svg, 210, 226, "override merged: global", "ts-s", "middle");
      } else {
        el("rect", { x: 152, y: 40, width: 116, height: 60, rx: 8, "class": "ts-slot" }, svg);
        txt(svg, 210, 64, "state A", "ts-b", "middle"); txt(svg, 210, 84, st.me.length + " commands", "ts-s", "middle");
        el("rect", { x: 152, y: 150, width: 116, height: 60, rx: 8, "class": "ts-slot" }, svg);
        txt(svg, 210, 174, "state B", "ts-b", "middle"); txt(svg, 210, 194, st.vs.length + " commands", "ts-s", "middle");
        el("path", { d: "M152 70 H136", "class": "ts-a", "marker-end": mk }, svg); el("path", { d: "M268 180 H284", "class": "ts-a", "marker-end": mk }, svg);
        txt(svg, 210, 128, "⊗ two states", "ts-m", "middle");
      }
    }
    function render() {
      var v = views();
      draw(v);
      out.innerHTML = '<div class="whole"><p>my editor</p><ul>' + v.me.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + '</ul></div><div class="whole"><p>vscode-like</p><ul>' + v.vs.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul></div>";
      var msg;
      if (v.mode === "share") msg = st.last === "hide" ? (st.hideG ? "The override went into the one state, so both wholes lost “find”." : "The override is tagged with my editor, so only my editor lost “find”.") : "One part. An edit made in either whole shows in both.";
      else msg = st.last === "hide" ? "In a fork, hiding “find” is an edit to my copy only." : "Two parts that started equal. An edit stays in the whole that made it.";
      verdict.textContent = msg;
      $(".t4-knob", root).hidden = v.mode !== "share";
      $$(".toy-q[data-show]", root).forEach(function (q) { q.classList.toggle("on", v.mode === "share" && st.last === "hide"); });
    }
    $$("[data-t4]", root).forEach(function (b) { b.addEventListener("click", function () { act(b.getAttribute("data-t4")); }); });
    $$('input[name="t4-mode"]', root).forEach(function (r) { r.addEventListener("change", function () { reset(); render(); }); });
    $$('input[name="t4-ov"]', root).forEach(function (r) { r.addEventListener("change", render); });
    render();
  }

  /* ---------- Toy 5: pace is earned ---------- */
  function toyPace() {
    var root = $("#toy-pace"); if (!root) return;
    var svg = $("#t5-svg"), verdict = $("#t5-verdict");
    var st;
    function reset() { st = { v: 1, deps: [], changed: false }; }
    reset();
    function draw() {
      svg.innerHTML = ""; var mk = arrowDefs(svg, "t5-arr");
      el("rect", { x: 140, y: 12, width: 200, height: 54, rx: 8, "class": "ts-slot ts-hot" }, svg);
      txt(svg, 240, 34, "vim-like template", "ts-b", "middle"); txt(svg, 240, 54, "version " + st.v, "ts-m", "middle");
      var n = st.deps.length;
      if (!n) { txt(svg, 240, 150, "nothing builds on it yet", "ts-s", "middle"); }
      st.deps.forEach(function (d, i) {
        var x = (480 / (n + 1)) * (i + 1), w = Math.min(70, 480 / (n + 1) - 8);
        el("path", { d: "M" + x + " 150 C" + x + " 110 240 100 240 70", "class": d.pin ? "ts-d" : "ts-a", "marker-end": mk }, svg);
        var g = el("g", { "class": "t5-dep", tabindex: 0, role: "button", "data-i": i, "aria-label": "Layer " + (i + 1) + ", " + (d.pin ? "pinned to version " + d.seen : "follows the latest version") }, svg);
        el("rect", { x: x - w / 2, y: 150, width: w, height: 56, rx: 6, "class": d.pin ? "ts-empty" : "ts-slot" }, g);
        txt(g, x, 170, "layer " + (i + 1), "ts-t", "middle");
        txt(g, x, 186, "sees v" + d.seen, "ts-m", "middle");
        txt(g, x, 200, d.pin ? "pinned" : "latest", "ts-s", "middle");
      });
      txt(svg, 240, 236, "built on by " + n, "ts-b", "middle");
    }
    function render() {
      draw();
      var n = st.deps.length, f = st.deps.filter(function (d) { return !d.pin; }).length;
      verdict.textContent = n === 0 ? "Nothing builds on the template: it can change every minute." :
        n + " layer" + (n === 1 ? " builds" : "s build") + " on it. A change reaches " + f + " now" + (n - f ? "; " + (n - f) + (n - f === 1 ? " stays" : " stay") + " pinned." : ".");
    }
    $$("[data-t5]", root).forEach(function (b) {
      b.addEventListener("click", function () {
        var a = b.getAttribute("data-t5");
        if (a === "reset") reset();
        if (a === "add" && st.deps.length < 8) st.deps.push({ pin: st.deps.length % 3 === 2, seen: st.v });
        if (a === "change") { st.v++; st.deps.forEach(function (d) { if (!d.pin) d.seen = st.v; }); }
        render();
      });
    });
    function toggle(e) {
      var g = e.target.closest && e.target.closest(".t5-dep"); if (!g) return;
      if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      var d = st.deps[+g.getAttribute("data-i")]; d.pin = !d.pin; if (!d.pin) d.seen = st.v;
      render();
    }
    svg.addEventListener("click", toggle); svg.addEventListener("keydown", toggle);
    st.deps = [{ pin: false, seen: 1 }, { pin: false, seen: 1 }, { pin: true, seen: 1 }];
    render();
  }

  function boot() {
    initRail(); initMarkSid(); initHero(); initNotebook(); initStack(); initRelations(); initBreakouts(); initMap(); initRounds();
    toyFinal(); toyDiff(); toyMerge(); toyShare(); toyPace();
    var h = (location.hash || "").slice(1);
    if (h && document.getElementById(h)) setTimeout(function () { go(h); }, 60);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
